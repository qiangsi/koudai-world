<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口袋世界 · 联机版</title>
<meta name="description" content="《口袋世界》是一个可离线运行的单文件网页小游戏：在网格地图上探索青禾镇、萤草坡与碎星林，在高草中随机遭遇野生灵兽，用回合制技能对战、投出灵球捕捉，收集图鉴、升级进化。角色、怪物与像素美术均为原创，支持键盘与手机触屏操作，自动存档。">
<meta name="theme-color" content="#0d1117">
<style>
:root{
  --ink:#0b0f14; --panel:#141b23; --panel2:#1b2530; --panel3:#22303d;
  --line:#2b3744; --line2:#3a4b5c;
  --text:#e9eff4; --dim:#93a4b3; --dim2:#6d7f8f;
  --green:#5fd08a; --gold:#f2c14e; --orange:#f08a5d; --blue:#5aa9e6; --purple:#a78bfa; --red:#ef6b6b;
  --flora:#6ec96e; --blaze:#f0864f; --tide:#5aa9e6; --stone:#b39a6f; --gale:#a78bfa;
  --radius:14px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 15% -10%, #1b2a33 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 110%, #221d2e 0%, transparent 55%),
    var(--ink);
  color:var(--text); font-family:var(--font); -webkit-text-size-adjust:100%;
  min-height:100dvh; overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none !important}

#app{
  width:min(100vw - 20px, 1000px); height:100dvh; max-height:100dvh;
  margin:0 auto; padding:10px 0 12px;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:8px;
}

/* ---------- HUD ---------- */
#hud{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:7px 10px; background:linear-gradient(180deg,#18222c,#121a22);
  border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}
.hud-left{display:flex; align-items:center; gap:10px; min-width:0; overflow:hidden}
.coin{
  display:flex; align-items:center; gap:6px; padding:5px 10px 5px 8px;
  background:#0f1720; border:1px solid var(--line2); border-radius:999px;
  font-family:var(--mono); font-size:13px; color:var(--gold); font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.coin svg{display:block}
.party-chips{display:flex; gap:5px; overflow:hidden}
.chip{
  display:flex; align-items:center; gap:4px; padding:3px 6px 3px 4px;
  background:#0f1720; border:1px solid var(--line); border-radius:8px; min-width:0;
}
.chip canvas{width:18px;height:18px;image-rendering:pixelated;display:block}
.chip .cn{font-size:11px;color:var(--dim);white-space:nowrap}
.chip .cb{width:26px;height:4px;background:#243039;border-radius:2px;overflow:hidden}
.chip .cb i{display:block;height:100%;background:var(--green);transition:width .3s}
.chip.low .cb i{background:var(--orange)}
.chip.dead{opacity:.45}
.hud-right{display:flex; gap:6px; flex:0 0 auto}
.hbtn{
  padding:7px 11px; font-size:12.5px; letter-spacing:.4px;
  background:#1d2833; border:1px solid var(--line2); border-radius:9px; color:#d5e2ec;
  transition:transform .08s, background .15s, border-color .15s;
}
.hbtn:hover{background:#26333f; border-color:#4c6274}
.hbtn:active{transform:translateY(1px)}

/* ---------- stage ---------- */
#stage{
  position:relative; border-radius:16px; overflow:hidden;
  border:1px solid var(--line2); background:#0e151b;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), 0 14px 34px rgba(0,0,0,.4);
  min-height:0;
}
#mapCanvas{display:block; width:100%; height:100%; touch-action:none}
#mapOverlay{position:absolute; inset:0; pointer-events:none}
#placeChip{
  position:absolute; left:12px; top:10px; padding:5px 11px; font-size:12px; letter-spacing:1px;
  background:rgba(9,14,19,.72); border:1px solid rgba(120,150,175,.35); border-radius:999px;
  color:#cfe0ec; backdrop-filter:blur(4px);
}
#hintChip{
  position:absolute; left:12px; bottom:10px; font-size:11.5px; color:#8fa3b4;
  background:rgba(9,14,19,.66); border-radius:8px; padding:4px 9px; border:1px solid rgba(120,150,175,.2);
}
.scan{position:absolute; inset:0; pointer-events:none; opacity:.16;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.09) 0 1px, transparent 1px 3px);}
.vig{position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 90px 20px rgba(0,0,0,.55);}
#fadeLayer{position:absolute; inset:0; background:#070b0f; opacity:0; pointer-events:none; transition:opacity .22s ease}

/* ---------- dialog ---------- */
.dialog-box{
  position:absolute; left:10px; right:10px; bottom:10px; padding:10px 12px 9px;
  background:linear-gradient(180deg, rgba(20,28,37,.97), rgba(12,18,24,.97));
  border:1px solid #4d6678; border-left:3px solid var(--green); border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.5); cursor:pointer; z-index:6;
  animation:popIn .16s ease;
}
.dlg-name{font-size:11.5px; letter-spacing:1.4px; color:var(--green); margin-bottom:3px}
.dlg-text{margin:0; font-size:14px; line-height:1.55; color:#e6eef5; min-height:1.5em}
.dlg-next{position:absolute; right:10px; bottom:5px; font-size:10px; color:var(--dim2)}
@keyframes popIn{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

/* ---------- controls ---------- */
#controls{
  display:flex; align-items:center; gap:14px;
  padding:6px 12px; border:1px solid var(--line); border-radius:var(--radius);
  background:linear-gradient(180deg,#141d26,#101820);
}
.dpad{
  display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,38px);
  gap:4px; flex:0 0 auto;
}
.dbtn{
  display:flex; align-items:center; justify-content:center;
  background:#1e2a35; border:1px solid var(--line2); border-radius:9px; padding:0;
  transition:background .1s, transform .07s; touch-action:none; user-select:none;
}
.dbtn svg{width:15px; height:15px; fill:#8fb0c8}
.dbtn:hover{background:#28353f}
.dbtn.press{background:#2f4353; transform:scale(.96)}
.dbtn.press svg{fill:#d6ecff}
.dbtn.up{grid-area:1/2} .dbtn.left{grid-area:2/1} .dbtn.right{grid-area:2/3} .dbtn.down{grid-area:3/2}
.dpad .core{grid-area:2/2; display:flex;align-items:center;justify-content:center;
  font-size:9px; letter-spacing:1px; color:#5d7385; border:1px dashed #2c3a47; border-radius:9px}
.aux{display:flex; flex-direction:column; gap:6px; flex:0 0 auto}
.round-btn{
  padding:10px 16px; border-radius:12px; font-size:13px; letter-spacing:1px;
  background:linear-gradient(180deg,#2b6b48,#1f5138); border:1px solid #46845f; color:#ddf5e5;
  box-shadow:0 3px 0 #143525;
}
.round-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #143525}
.round-btn.ghost{background:#1c2732; border-color:#3a4b5c; color:#b8cad8; box-shadow:0 3px 0 #0d151c}
.tips{font-size:11.5px; color:var(--dim2); line-height:1.6; min-width:0}
.tips b{color:#a9bfd0; font-weight:500}
.tips .k{display:inline-block; padding:0 5px; border:1px solid #354555; border-radius:4px; font-family:var(--mono); font-size:10.5px; color:#a9bfd0}

/* ---------- battle ---------- */
#battleLayer{position:absolute; inset:0; z-index:5; overflow:hidden}
.battle-sky{position:absolute; inset:0;
  background:
    radial-gradient(700px 260px at 70% 8%, rgba(140,200,255,.22), transparent 70%),
    linear-gradient(180deg,#1b2f3f 0%, #16242f 46%, #1a2a25 62%, #14201c 100%);
}
.battle-sky:after{content:""; position:absolute; inset:0; opacity:.35;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 10px);}
.battle-hills{position:absolute; left:0; right:0; bottom:34%; height:30%; pointer-events:none;
  background:
    radial-gradient(ellipse 42% 100% at 16% 100%, #20363a 0 72%, transparent 73%),
    radial-gradient(ellipse 34% 108% at 52% 100%, #1a2c30 0 72%, transparent 73%),
    radial-gradient(ellipse 46% 118% at 88% 100%, #1e3238 0 72%, transparent 73%);
  opacity:.9;}
.battle-ground{position:absolute; left:0; right:0; bottom:0; height:40%;
  background:linear-gradient(180deg,#33492f 0%,#263a26 34%,#1b2a1e 72%,#131d18 100%);
  box-shadow:inset 0 8px 18px rgba(0,0,0,.28);}
.battle-ground:before{content:""; position:absolute; inset:0; opacity:.55;
  background:radial-gradient(160px 30px at 46% 8%, rgba(190,230,170,.12), transparent 70%),
             radial-gradient(120px 22px at 20% 46%, rgba(190,230,170,.08), transparent 70%),
             radial-gradient(120px 22px at 74% 66%, rgba(190,230,170,.06), transparent 70%);
  background-size:auto, auto, auto;}
.battle-ground:after{content:""; position:absolute; left:0; right:0; top:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(190,230,170,.25), transparent);}
.battle-topbar{position:absolute; left:12px; top:10px; display:flex; gap:8px; align-items:center; z-index:3}
.battle-topbar span{font-size:11px; letter-spacing:1px; padding:4px 9px; border-radius:999px;
  background:rgba(8,13,17,.7); border:1px solid rgba(120,150,175,.3); color:#bcd2e2}
#turnTag{color:#ffd98a; border-color:rgba(242,193,78,.35)}
.slot{position:absolute; display:flex; z-index:3; gap:10px}
.enemy-slot{right:4%; top:13%; flex-direction:column; align-items:flex-end; gap:2px}
.player-slot{left:4%; bottom:24%; flex-direction:row; align-items:flex-end; gap:10px}
.sprite-hold{position:relative; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px}
.plat{position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:112%; height:24px;
  border-radius:50%; z-index:0;
  background:radial-gradient(ellipse at 50% 26%, #4d7355 0 45%, #2b4030 72%, #1e2c22 100%);
  box-shadow:0 8px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(220,240,220,.16);}
.plat:after{content:""; position:absolute; left:12%; right:12%; top:30%; height:3px; border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(190,230,180,.22), transparent 70%);}
.player-slot .plat{width:104%; height:18px}
.sprite-wrap{position:relative; z-index:1; filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
#enemySprite,#playerSprite{width:clamp(80px,17vw,132px); height:auto; display:block; image-rendering:pixelated}
#playerSprite{transform:scaleX(-1)}
.info-card{
  min-width:132px; padding:6px 9px; border-radius:9px; z-index:3;
  background:rgba(10,16,21,.82); border:1px solid rgba(120,150,175,.34);
  backdrop-filter:blur(3px);
}
.ic-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.mon-name{font-size:13px; letter-spacing:.5px}
.mon-lv{font-family:var(--mono); font-size:11px; color:var(--dim)}
.type-tag{display:inline-block; margin:3px 0 5px; font-size:10px; padding:1px 6px; border-radius:999px;
  border:1px solid currentColor; opacity:.95}
.hpbar{height:6px; background:#1d2a33; border-radius:3px; overflow:hidden; border:1px solid #2c3d4a}
.hpbar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#4ec97c,#7ee0a1);
  transition:width .45s cubic-bezier(.4,.1,.2,1), background .3s}
.hpbar.mid i{background:linear-gradient(90deg,#e8b64c,#f7d47a)}
.hpbar.low i{background:linear-gradient(90deg,#e4614f,#f38a72)}
.hp-num{display:flex; justify-content:space-between; gap:8px; margin-top:3px;
  font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.exp-tag{color:#7fb0d4}
.battle-log{
  position:absolute; left:10px; right:10px; bottom:10px; min-height:74px; padding:9px 12px;
  background:linear-gradient(180deg, rgba(16,23,30,.96), rgba(10,15,20,.96));
  border:1px solid #47606f; border-left:3px solid var(--gold); border-radius:10px;
  z-index:4; max-width:calc(100% - 20px);
}
.battle-log p{margin:0; font-size:13.5px; line-height:1.5; color:#e7eff6; min-height:1.2em}
.battle-log p+p{color:#a9c3d6; font-size:12.5px; margin-top:2px}
.battle-actions{
  position:absolute; right:10px; bottom:92px; z-index:4; display:grid;
  grid-template-columns:repeat(2,minmax(78px,1fr)); gap:6px;
}
.act{
  padding:9px 10px; font-size:13px; border-radius:9px; letter-spacing:1px;
  background:linear-gradient(180deg,#243442,#1a2731); border:1px solid #46606f; color:#dbeaf6;
  transition:transform .07s, background .12s;
}
.act:hover{background:#2c3f4d}
.act:active{transform:translateY(1px)}
.act.primary{border-color:#4c8f6b; color:#d8f5e3; background:linear-gradient(180deg,#28543d,#1c3c2b)}
.act:disabled{opacity:.4; cursor:default}
.battle-sub{
  position:absolute; left:10px; right:10px; bottom:92px; z-index:5; max-height:52%;
  overflow:auto; padding:8px; border-radius:11px;
  background:rgba(11,17,23,.95); border:1px solid #47606f; box-shadow:0 10px 26px rgba(0,0,0,.5);
  display:grid; gap:6px;
}
.sub-row{
  display:grid; grid-template-columns:1fr auto auto auto; gap:8px; align-items:center;
  padding:7px 9px; border-radius:8px; background:#17222c; border:1px solid #2c3d4a; text-align:left;
  font-size:12.5px;
}
.sub-row:hover{background:#20303c; border-color:#45606f}
.sub-row:disabled{opacity:.42}
.sub-row .mv-type{font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid currentColor}
.sub-row .mv-pp{font-family:var(--mono); font-size:11px; color:var(--dim)}
.sub-head{display:flex; justify-content:space-between; align-items:center; padding:0 2px 2px;
  font-size:11px; letter-spacing:1px; color:var(--dim)}
.sub-close{padding:4px 9px; font-size:11px; background:#1c2732; border:1px solid #3a4b5c; border-radius:7px; color:#b8cad8}
#captureLayer{position:absolute; inset:0; z-index:7; pointer-events:none}
.ball{
  position:absolute; width:22px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, #d9e6ef 40%, #8fa4b3 70%);
  border:2px solid #2c3a45; box-shadow:0 0 10px rgba(180,220,255,.6);
  left:18%; bottom:34%; opacity:0;
}
.ball.throw{animation:throwArc .62s cubic-bezier(.3,-0.2,.6,1) forwards}
.ball.shake{animation:shake .5s ease-in-out 3}
.ball.caught{animation:caughtGlow .8s ease forwards}
@keyframes throwArc{
  0%{opacity:1; transform:translate(0,0) scale(.9) rotate(0)}
  50%{transform:translate(30vw,-22vh) rotate(220deg) scale(1)}
  100%{opacity:1; transform:translate(58vw,-8vh) rotate(440deg) scale(1)}
}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-5px) rotate(-9deg)}75%{transform:translateX(5px) rotate(9deg)}}
@keyframes caughtGlow{to{filter:brightness(1.8) drop-shadow(0 0 14px #ffe9a8)}}
#evoLayer{position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px;
  background:radial-gradient(circle at 50% 45%, rgba(120,200,255,.18), rgba(4,7,10,.92) 65%)}
#evoSprite{width:clamp(140px,30vw,220px); height:auto; image-rendering:pixelated;
  filter:drop-shadow(0 0 22px rgba(150,220,255,.55))}
#evoText{margin:0; font-size:13.5px; letter-spacing:2px; color:#cfe6f6}
.evo-layer.flash #evoSprite{animation:evoFlash .5s steps(2,end) infinite}
@keyframes evoFlash{0%{filter:brightness(3) saturate(0)}100%{filter:brightness(1) saturate(1.2) drop-shadow(0 0 26px rgba(160,230,255,.8))}}

/* ---------- modal ---------- */
.modal-root{
  position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
  padding:16px; background:rgba(5,8,11,.72); backdrop-filter:blur(6px);
  animation:popIn .16s ease;
}
.modal-card{
  width:min(100%,560px); max-height:min(86dvh,720px); overflow:auto;
  background:linear-gradient(180deg,#161f28,#101821);
  border:1px solid #3a4f60; border-radius:16px; padding:16px 16px 14px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.modal-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.modal-title{font-size:16px; letter-spacing:1.5px}
.modal-close{padding:5px 10px; font-size:12px; background:#1c2732; border:1px solid #3a4b5c; border-radius:8px; color:#b8cad8}
.muted{color:var(--dim); font-size:12px; line-height:1.65}
.panel-grid{display:grid; gap:8px}
.mon-row{
  display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center;
  padding:8px; border-radius:10px; background:#121b23; border:1px solid #263440;
}
.mon-row.lead{border-color:#4c8f6b; background:#14241c}
.mon-row.fainted{opacity:.6}
.mon-row canvas{width:40px;height:40px;image-rendering:pixelated}
.mon-row .mr-name{font-size:13px}
.mon-row .mr-sub{font-size:11px; color:var(--dim); font-family:var(--mono)}
.bar{height:5px; background:#1d2a33; border-radius:3px; overflow:hidden; margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.bar.exp i{background:#5aa9e6}
.small-btn{
  padding:6px 10px; font-size:11.5px; border-radius:8px; background:#1e2a35;
  border:1px solid var(--line2); color:#cfe0ec; white-space:nowrap;
}
.small-btn:hover{background:#28353f}
.small-btn.primary{background:#1f5138; border-color:#46845f; color:#ddf5e5}
.small-btn.danger{background:#4a2020; border-color:#7d3a3a; color:#f2c9c9}
.move-list{display:grid; gap:4px; margin-top:6px; grid-column:1/-1}
.move-pill{display:flex; justify-content:space-between; gap:8px; font-size:11px; color:#a9c3d6;
  padding:3px 7px; border-radius:6px; background:#0f1720; border:1px solid #22303b}
.dex-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px}
.dex-cell{display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px 6px;
  border-radius:10px; background:#121b23; border:1px solid #263440}
.dex-cell canvas{width:52px;height:52px;image-rendering:pixelated}
.dex-cell .dn{font-size:11.5px}
.dex-cell .dx{font-size:10px; color:var(--dim2); font-family:var(--mono)}
.dex-cell.unknown{opacity:.5}
.dex-cell .caught{font-size:9.5px; color:var(--green); letter-spacing:1px}
.type-chart{display:grid; gap:4px; margin-top:8px}
.tc-row{display:grid; grid-template-columns:58px 1fr; gap:8px; align-items:center; font-size:11px}
.tc-bar{height:16px; border-radius:5px; background:#0f1720; border:1px solid #22303b; position:relative; overflow:hidden}
.tc-bar i{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#28543d,#3f7a58)}
.chart-table{width:100%; border-collapse:collapse; font-size:11px; margin-top:8px}
.chart-table th,.chart-table td{border:1px solid #263440; padding:3px 5px; text-align:center; color:#b8cad8}
.chart-table th{background:#131c24; color:var(--dim); font-weight:500}
.cell-super{color:#7ee0a1; background:rgba(95,208,138,.12)}
.cell-weak{color:#f0a08c; background:rgba(240,140,110,.12)}
.shop-grid{display:grid; gap:7px}
.shop-row{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center;
  padding:8px 10px; border-radius:9px; background:#121b23; border:1px solid #263440}
.shop-row .sp-name{font-size:13px}
.shop-row .sp-desc{font-size:11px; color:var(--dim); margin-top:2px}
.shop-row .sp-price{font-family:var(--mono); font-size:12px; color:var(--gold)}
.bag-item{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center;
  padding:8px 10px; border-radius:9px; background:#121b23; border:1px solid #263440}
.bag-item .bi-name{font-size:13px}
.bag-item .bi-des{font-size:11px; color:var(--dim); margin-top:2px}
.bag-item .bi-num{font-family:var(--mono); font-size:13px; color:#cfe0ec}
.settings-list{display:grid; gap:8px}
.set-row{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 10px; border-radius:9px; background:#121b23; border:1px solid #263440; font-size:13px}
.set-row .muted{margin-top:2px}
.starter-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.starter{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px 10px;
  border-radius:12px; background:#121b23; border:1px solid #2b3a47; transition:transform .1s, border-color .15s, background .15s;
}
.starter:hover{transform:translateY(-2px); border-color:#5b7a8f; background:#16202a}
.starter.sel{border-color:#5fd08a; background:#14241c; box-shadow:0 0 0 1px #3f7a58 inset}
.starter canvas{width:64px;height:64px;image-rendering:pixelated}
.starter .st-name{font-size:13px}
.starter .st-desc{font-size:10.5px; color:var(--dim); text-align:center; line-height:1.45; min-height:3em}
.tip-card{display:grid; gap:7px; margin:10px 0 4px}
.tip-line{display:flex; gap:9px; font-size:12.5px; color:#cfdde8; line-height:1.5}
.tip-line .tk{flex:0 0 auto; width:20px; height:20px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  background:#1d2a35; border:1px solid #35485a; font-family:var(--mono); font-size:10.5px; color:#9fc0d8}
.title-big{font-size:26px; letter-spacing:6px; margin:2px 0 2px}
.title-sub{font-size:11.5px; letter-spacing:2px; color:var(--dim); margin:0 0 10px}
.divider{height:1px; background:linear-gradient(90deg,transparent,#2b3744 20%,#2b3744 80%,transparent); margin:12px 0}
.note{font-size:10.5px; color:var(--dim2); line-height:1.6}
.kbd{display:inline-block; padding:0 5px; border:1px solid #354555; border-radius:4px; font-family:var(--mono); font-size:10.5px; color:#a9bfd0}

/* ---------- toasts ---------- */
.toasts{position:fixed; left:50%; transform:translateX(-50%); top:14px; z-index:60; display:grid; gap:6px; pointer-events:none}
.toast{
  padding:7px 14px; border-radius:999px; font-size:12px; letter-spacing:.5px;
  background:rgba(14,22,29,.94); border:1px solid #3f7a58; color:#d8f5e3;
  box-shadow:0 8px 20px rgba(0,0,0,.45); animation:toastIn .2s ease, toastOut .3s ease 1.5s forwards;
}
.toast.warn{border-color:#8a6a3a; color:#f7e2b8}
@keyframes toastIn{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}
@keyframes toastOut{to{opacity:0; transform:translateY(-6px)}}

/* ---------- shake / bump ---------- */
.shake-hit{animation:shakeHit .32s ease}
@keyframes shakeHit{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.flash-white{animation:flashWhite .34s ease}
@keyframes flashWhite{0%{filter:brightness(3.4)}100%{filter:brightness(1)}}
.sprite-wrap.hit{animation:shakeHit .32s ease}
.sprite-wrap.faint{animation:faintOut .55s ease forwards}
@keyframes faintOut{to{opacity:0; transform:translateY(26px) scale(.7)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#playerSprite.bob{animation:bobBack 2.6s ease-in-out infinite}
@keyframes bobBack{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-4px)}}
.encounter-flash{position:absolute; inset:0; background:#eaf6ff; opacity:0; z-index:9; pointer-events:none}
.encounter-flash.on{animation:enc .55s ease-out}
@keyframes enc{0%{opacity:0}18%{opacity:.92}40%{opacity:.1}60%{opacity:.8}100%{opacity:0}}

@media (max-width:700px){
  #app{width:calc(100vw - 12px); padding:6px 0 8px; gap:6px}
  #hud{padding:6px 8px; gap:6px; flex-wrap:wrap}
  .party-chips{display:none}
  .hbtn{padding:7px 9px; font-size:12px}
  .coin{font-size:12px; padding:4px 9px}
  .dpad{grid-template-columns:repeat(3,46px); grid-template-rows:repeat(3,36px)}
  .tips{display:none}
  #hintChip{font-size:10.5px; left:8px; bottom:8px}
  #placeChip{font-size:11px; left:8px; top:8px}
  .battle-actions{bottom:82px; grid-template-columns:repeat(2,minmax(70px,1fr))}
  .mon-name{font-size:12px}
  .info-card{min-width:112px; padding:5px 7px}
  .starter-grid{grid-template-columns:1fr; gap:6px}
  .starter{flex-direction:row; align-items:center; text-align:left; padding:8px 10px}
  .starter canvas{width:48px;height:48px}
  .starter .st-desc{min-height:0; text-align:left; font-size:10px}
  .title-big{font-size:22px; letter-spacing:4px}
}
@media (max-height:520px){
  #controls .dpad{grid-template-columns:repeat(3,38px); grid-template-rows:repeat(3,30px)}
  #hintChip{display:none}
}

/* 进化后额外装饰 */
function drawExtra(ctx, kind, pal, unit){
  var r = function(x,y,w,h,col){ ctx.fillStyle = col; ctx.fillRect(x*unit, y*unit, w*unit, h*unit); };
  if(kind === 'crown'){
    r(5,0,2,2,pal.d); r(9,0,2,2,pal.d); r(7,1,2,1,pal.d);
    r(5,2,2,1,pal.c); r(9,2,2,1,pal.c);
  } else if(kind === 'crest'){
    r(6,0,1,3,pal.d); r(8,0,1,2,pal.d); r(10,1,1,2,pal.d);
  } else if(kind === 'aura'){
    r(2,1,1,1,pal.c); r(13,2,1,1,pal.c); r(1,10,1,1,pal.c); r(14,11,1,1,pal.c);
    r(4,14,1,1,pal.c); r(11,14,1,1,pal.c);
  }
}

var spriteCache = {};
function drawSprite(canvas, speciesId, opts){
  opts = opts || {};
  var sp = SPECIES[speciesId];
  if(!sp) return;
  var grid = SPRITES[sp.sprite];
  var pal = PALS[sp.pal] || PALS[sp.sprite];
  var unit = opts.unit || 8;
  var ctx = canvas.getContext('2d');
  var W = 16 * unit;
  if(canvas.width !== W || canvas.height !== W){ canvas.width = W; canvas.height = W; }
  ctx.clearRect(0,0,W,W);
  ctx.imageSmoothingEnabled = false;
  for(var y=0;y<16;y++){
    var row = grid[y] || '';
    for(var x=0;x<16;x++){
      var ch = row.charAt(x);
      if(!ch || ch === '.') continue;
      var col = pal[ch];
      if(!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x*unit, y*unit, unit, unit);
    }
  }
  if(sp.extra) drawExtra(ctx, sp.extra, pal, unit);
  if(opts.silhouette){
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = opts.silhouette;
    ctx.fillRect(0,0,W,W);
    ctx.globalCompositeOperation = 'source-over';
  }
}

function monChip(canvas, speciesId, size){
  var unit = Math.max(2, Math.round((size || 18) / 16));
  drawSprite(canvas, speciesId, {unit:unit});
}

/* ---------------- 地块 ---------------- */
function hash2(x, y){
  var h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

var TILE = 16;
var PAL_TILE = {
  grassA:'#4f7d4d', grassB:'#467244', grassC:'#5d8f57', grassD:'#3e663d',
  dirtA:'#a08659', dirtB:'#8f7650', dirtC:'#b39a6b', dirtD:'#78613f',
  tallA:'#3d6b3c', tallB:'#2f5630', tallC:'#5f9a52',
  treeA:'#2f5a33', treeB:'#24472a', treeC:'#3f7742', trunk:'#5d4126', trunkD:'#43301c',
  waterA:'#3a7fa8', waterB:'#2f6c92', waterC:'#7fc4e0',
  wallA:'#c8bd9d', wallB:'#a99d80', roofA:'#7d4b3a', roofB:'#5d3628',
  doorA:'#8a5c34', doorB:'#6b4527', knob:'#e8c46a',
  springA:'#5fc6c0', springB:'#2f8f8a', stoneA:'#8d8778', stoneB:'#6b665a',
  flowerA:'#f2a9c4', flowerB:'#f7dc6f', flowerC:'#c8a2f0'
};

function fillTile(ctx, ox, oy, s, col){
  ctx.fillStyle = col;
  ctx.fillRect(ox, oy, s * TILE, s * TILE);
}
function px(ctx, ox, oy, s, gx, gy, gw, gh, col){
  ctx.fillStyle = col;
  ctx.fillRect(ox + gx * s, oy + gy * s, gw * s, gh * s);
}

function drawGrassBase(ctx, ox, oy, s, x, y){
  fillTile(ctx, ox, oy, s, PAL_TILE.grassA);
  var h = hash2(x, y);
  for(var i=0;i<5;i++){
    var r1 = hash2(x*7+i, y*13+i*3), r2 = hash2(x*3+i*5, y*11+i);
    var gx = Math.floor(r1*15), gy = Math.floor(r2*15);
    px(ctx, ox, oy, s, gx, gy, 1, 1, (i%2 ? PAL_TILE.grassC : PAL_TILE.grassD));
  }
  if(h > 0.86){ px(ctx, ox, oy, s, 6, 9, 2, 1, PAL_TILE.grassC); px(ctx, ox, oy, s, 7, 8, 1, 2, PAL_TILE.grassC); }
}

function drawTile(ctx, ch, ox, oy, s, x, y, t){
  switch(ch){
    case ',':
      drawGrassBase(ctx, ox, oy, s, x, y);
      break;
    case '.':
      fillTile(ctx, ox, oy, s, PAL_TILE.dirtA);
      for(var i=0;i<4;i++){
        var r1 = hash2(x*11+i, y*17+i*2), r2 = hash2(x*5+i*3, y*7+i);
        px(ctx, ox, oy, s, Math.floor(r1*14), Math.floor(r2*14), 2, 1, (i%2?PAL_TILE.dirtC:PAL_TILE.dirtB));
      }
      break;
    case 'G':
      drawGrassBase(ctx, ox, oy, s, x, y);
      px(ctx, ox, oy, s, 2, 6, 1, 9, PAL_TILE.tallB);
      px(ctx, ox, oy, s, 5, 4, 1, 11, PAL_TILE.tallC);
      px(ctx, ox, oy, s, 8, 7, 1, 8, PAL_TILE.tallB);
      px(ctx, ox, oy, s, 11, 3, 1, 12, PAL_TILE.tallC);
      px(ctx, ox, oy, s, 14, 6, 1, 9, PAL_TILE.tallB);
      px(ctx, ox, oy, s, 3, 12, 1, 3, PAL_TILE.tallA);
      px(ctx, ox, oy, s, 9, 12, 1, 3, PAL_TILE.tallA);
      break;
    case 'T':
      drawGrassBase(ctx, ox, oy, s, x, y);
      px(ctx, ox, oy, s, 7, 10, 2, 5, PAL_TILE.trunk);
      px(ctx, ox, oy, s, 7, 10, 1, 5, PAL_TILE.trunkD);
      px(ctx, ox, oy, s, 3, 3, 10, 8, PAL_TILE.treeA);
      px(ctx, ox, oy, s, 4, 2, 8, 2, PAL_TILE.treeC);
      px(ctx, ox, oy, s, 2, 5, 3, 5, PAL_TILE.treeB);
      px(ctx, ox, oy, s, 11, 5, 3, 5, PAL_TILE.treeB);
      px(ctx, ox, oy, s, 4, 9, 8, 2, PAL_TILE.treeB);
      px(ctx, ox, oy, s, 5, 4, 1, 1, PAL_TILE.treeC);
      px(ctx, ox, oy, s, 9, 3, 1, 1, PAL_TILE.treeC);
      px(ctx, ox, oy, s, 12, 8, 1, 2, PAL_TILE.treeA);
      break;
    case 'W':
      fillTile(ctx, ox, oy, s, PAL_TILE.waterA);
      px(ctx, ox, oy, s, 0, 0, 16, 1, PAL_TILE.waterB);
      var ph = Math.sin((t/700) + x*0.9 + y*0.6);
      px(ctx, ox, oy, s, 2 + Math.round(ph), 4, 4, 1, PAL_TILE.waterC);
      px(ctx, ox, oy, s, 8 - Math.round(ph), 9, 5, 1, PAL_TILE.waterC);
      px(ctx, ox, oy, s, 3, 12, 3, 1, PAL_TILE.waterB);
      break;
    case 'H':
      fillTile(ctx, ox, oy, s, PAL_TILE.wallA);
      px(ctx, ox, oy, s, 0, 0, 16, 2, PAL_TILE.roofB);
      px(ctx, ox, oy, s, 0, 2, 16, 1, PAL_TILE.roofA);
      for(var wy=6; wy<16; wy+=5) px(ctx, ox, oy, s, 0, wy, 16, 1, PAL_TILE.wallB);
      px(ctx, ox, oy, s, 0, 0, 1, 16, PAL_TILE.wallB);
      px(ctx, ox, oy, s, 15, 0, 1, 16, PAL_TILE.wallB);
      break;
    case 'D':
      fillTile(ctx, ox, oy, s, PAL_TILE.wallA);
      px(ctx, ox, oy, s, 0, 0, 16, 4, PAL_TILE.roofB);
      px(ctx, ox, oy, s, 2, 5, 12, 11, PAL_TILE.doorA);
      px(ctx, ox, oy, s, 3, 6, 10, 9, PAL_TILE.doorB);
      px(ctx, ox, oy, s, 4, 7, 8, 1, PAL_TILE.doorA);
      px(ctx, ox, oy, s, 11, 10, 1, 1, PAL_TILE.knob);

      drawGrassBase(ctx, ox, oy, s, x, y);

      px(ctx, ox, oy, s, 10, 8, 1, 3, PAL_TILE.tallB);
      px(ctx, ox, oy, s, 3, 4, 3, 2, PAL_TILE.flowerA);
      px(ctx, ox, oy, s, 9, 7, 3, 2, PAL_TILE.flowerB);
      px(ctx, ox, oy, s, 6, 11, 2, 2, PAL_TILE.flowerC);
      break;
    case 'S':
      drawGrassBase(ctx, ox, oy, s, x, y);
      px(ctx, ox, oy, s, 7, 9, 2, 6, PAL_TILE.trunk);
      px(ctx, ox, oy, s, 2, 3, 12, 7, '#c9a86a');
      px(ctx, ox, oy, s, 3, 4, 10, 5, '#a8894f');
      px(ctx, ox, oy, s, 4, 6, 8, 1, '#5d4126');
      break;
    case 'C':
      drawGrassBase(ctx, ox, oy, s, x, y);
      px(ctx, ox, oy, s, 1, 5, 14, 3, '#d9634f');
      px(ctx, ox, oy, s, 1, 8, 14, 6, '#8a5c34');
      px(ctx, ox, oy, s, 3, 10, 10, 1, '#6b4527');
      px(ctx, ox, oy, s, 1, 5, 3, 3, '#f0e4c8');
      px(ctx, ox, oy, s, 7, 5, 3, 3, '#f0e4c8');
      px(ctx, ox, oy, s, 12, 5, 3, 3, '#f0e4c8');
      break;
    case 'A':
      drawGrassBase(ctx, ox, oy, s, x, y);
      px(ctx, ox, oy, s, 2, 6, 12, 9, PAL_TILE.stoneA);
      px(ctx, ox, oy, s, 3, 7, 10, 7, PAL_TILE.stoneB);
      var gl = Math.sin(t/420)*0.5+0.5;
      ctx.globalAlpha = 0.65 + gl*0.35;
      px(ctx, ox, oy, s, 4, 8, 8, 5, PAL_TILE.springA);
      px(ctx, ox, oy, s, 5, 9, 3, 1, '#d8fffb');
      ctx.globalAlpha = 1;
      px(ctx, ox, oy, s, 6, 8, 1, 1, '#eafefc');
      break;
    case 'R':
      drawGrassBase(ctx, ox, oy, s, x, y);
      px(ctx, ox, oy, s, 3, 8, 10, 6, PAL_TILE.stoneA);
      px(ctx, ox, oy, s, 4, 6, 8, 4, PAL_TILE.stoneB);
      px(ctx, ox, oy, s, 5, 7, 2, 1, PAL_TILE.stoneA);
      break;
    case 'x':
      drawGrassBase(ctx, ox, oy, s, x, y);
      px(ctx, ox, oy, s, 2, 6, 2, 8, '#8a6a45');
      px(ctx, ox, oy, s, 12, 6, 2, 8, '#8a6a45');
      px(ctx, ox, oy, s, 2, 8, 12, 2, '#a8825a');
      break;
    case '=':
      fillTile(ctx, ox, oy, s, PAL_TILE.dirtA);
      px(ctx, ox, oy, s, 0, 2, 16, 12, PAL_TILE.dirtC);
      px(ctx, ox, oy, s, 0, 6, 16, 2, PAL_TILE.dirtB);
      break;
    default:
      drawGrassBase(ctx, ox, oy, s, x, y);
  }
}

var CHAR_PAL = {hair:'#3a2b23', hairL:'#5b4433', skin:'#f0c8a0', skinD:'#d3a179', shirt:'#5aa9e6', shirtD:'#3d7cb0', pants:'#33415c', shoe:'#20262e', pack:'#c9884f'};

function drawHero(ctx, ox, oy, s, dir, frame){
  var P = CHAR_PAL;
  var r = function(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(ox+x*s, oy+y*s, w*s, h*s); };
  var bob = frame ? 1 : 0;
  // 影子
  ctx.globalAlpha = .25; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(ox+8*s, oy+15.2*s, 5*s, 1.6*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  if(dir === 'up'){
    r(4,3,8,3,P.hair); r(4,6,8,4,P.hair); r(5,7,6,3,P.hairL);
    r(4,10,8,4,P.shirt); r(4,12,8,2,P.shirtD);
    r(3,10,1,4,P.skin); r(12,10,1,4,P.skin);
    r(3,9,10,2,P.pack); r(4,9,2,1,P.shirtD);
    r(5,14,2,1+bob,P.pants); r(9,14,2,1+bob,P.pants);
    r(4,15,3,1,P.shoe); r(9,15,3,1,P.shoe);
  } else if(dir === 'down'){
    r(4,2,8,2,P.hair); r(3,4,10,3,P.hair); r(4,5,8,2,P.hairL);
    r(5,7,6,2,P.skin); r(6,8,1,1,'#2a1f19'); r(9,8,1,1,'#2a1f19');
    r(4,9,8,4,P.shirt); r(4,12,8,2,P.shirtD);
    r(3,9,1,4,P.skin); r(12,9,1,4,P.skin);
    r(5,13,2,1+bob,P.pants); r(9,13,2,1+bob,P.pants);
    r(4,15,3,1,P.shoe); r(9,15,3,1,P.shoe);
  } else {
    var flip = (dir === 'left');
    var X = function(x){ return flip ? (15 - x) : x; };
    r(X(4),2,6,2,P.hair); r(X(3),4,7,3,P.hair); r(X(4),5,5,2,P.hairL);
    r(X(4),7,5,2,P.skin);
    r(X(8),7,1,1,'#2a1f19');
    r(X(4),9,6,4,P.shirt); r(X(3),11,7,2,P.shirtD);
    r(X(9),10,1,3,P.skin);
    r(X(5),13,2,1+bob,P.pants); r(X(8),13,2,1+bob,P.pants);
    r(X(4),15,3,1,P.shoe); r(X(8),15,3,1,P.shoe);
  }
}

function stats(mon){
  var b = SPECIES[mon.sp].base, L = mon.lvl;
  return {
    hp : Math.floor(2 * b.hp  * L / 100) + L + 12,
    atk: Math.floor(2 * b.atk * L / 100) + 5,
    def: Math.floor(2 * b.def * L / 100) + 5,
    spd: Math.floor(2 * b.spd * L / 100) + 5
  };
}
function maxHp(mon){ return stats(mon).hp; }
function expToNext(lvl){ return Math.round(18 + 1.6 * lvl * lvl + 5 * lvl); }

function movesFor(spId, lvl){
  var list = [];
  SPECIES[spId].learn.forEach(function(e){
    if(e.lv <= lvl && list.indexOf(e.m) < 0) list.push(e.m);
  });
  if(list.length > 4) list = list.slice(list.length - 4);
  if(!list.length) list = ['pinyin'];
  return list.map(function(id){ return {id:id, pp:MOVES[id].pp}; });
}

function makeMon(spId, lvl){
  var mon = {
    uid: 'm' + Date.now().toString(36) + Math.floor(Math.random()*999),
    sp: spId, lvl: lvl, exp: 0, hp: 0, moves: movesFor(spId, lvl)

/* ---------------- 音效 ---------------- */
var audio = {ctx:null, muted:false};
function audioCtx(){
  if(audio.muted) return null;
  if(!audio.ctx){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audio.ctx = new AC();
    }catch(e){ return null; }
  }
  if(audio.ctx.state === 'suspended'){ audio.ctx.resume(); }
  return audio.ctx;
}
function tone(freq, dur, type, gain, delay){
  var ctx = audioCtx(); if(!ctx) return;
  var t0 = ctx.currentTime + (delay || 0);
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.05, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function slide(f1, f2, dur, type, gain){
  var ctx = audioCtx(); if(!ctx) return;
  var t0 = ctx.currentTime;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t0 + dur);
  g.gain.setValueAtTime(gain || 0.05, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(name){
  if(audio.muted) return;
  switch(name){
    case 'ui':        tone(660, .05, 'square', .025); break;
    case 'step':      tone(220, .035, 'triangle', .018); break;
    case 'bump':      tone(120, .07, 'square', .03); break;
    case 'encounter': tone(520,.08,'square',.045,0); tone(660,.08,'square',.045,.09); tone(880,.12,'square',.05,.18); break;
    case 'hit':       slide(520, 180, .16, 'sawtooth', .05); break;
    case 'superhit':  slide(760, 160, .22, 'sawtooth', .06); tone(300,.1,'square',.04,.06); break;
    case 'weak':      slide(300, 240, .12, 'triangle', .04); break;
    case 'faint':     slide(420, 90, .5, 'triangle', .05); break;
    case 'throw':     slide(300, 700, .18, 'sine', .04); break;
    case 'shake':     tone(380, .05, 'square', .03); break;
    case 'catch':     tone(660,.09,'square',.05); tone(880,.09,'square',.05,.1); tone(1170,.2,'square',.05,.2); break;
    case 'breakout':  slide(500, 240, .2, 'sawtooth', .05); break;
    case 'levelup':   [523,659,784,1046].forEach(function(f,i){ tone(f,.12,'square',.045,i*.09); }); break;
    case 'evolve':    [392,523,659,784,1046,1318].forEach(function(f,i){ tone(f,.16,'sine',.05,i*.11); }); break;
    case 'heal':      [440,554,659].forEach(function(f,i){ tone(f,.16,'sine',.04,i*.08); }); break;
    case 'buy':       tone(880,.07,'square',.04); tone(1170,.1,'square',.04,.08); break;
    case 'error':     tone(180,.12,'square',.04); break;
    case 'win':       [523,659,784,1046].forEach(function(f,i){ tone(f,.14,'triangle',.05,i*.07); }); break;
  }
}

function openPotionTarget(itemKey){
  var it = ITEMS[itemKey];

    return '<button class="mon-row" style="width:100%;text-align:left" data-heal="' + i + '"' + (m.hp >= mx || m.hp <= 0 ? ' disabled' : '') + '>' +

    '<div class="modal-head"><div class="modal-title">使用' + it.name + '</div><button class="modal-close" data-close="1">返回</button></div>' +

      game.items[itemKey]--;

/* =========================================================
   世界：地图、移动、渲染、互动
   ========================================================= */
var DIRS = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
var BLOCKED = 'TWHDSxCRA';
var MOVE_MS = 132;
var canvas, ctx, dpr = 1, tile = 32, viewW = 0, viewH = 0;

function normalizeRows(rows){
  var w = 0;
  rows.forEach(function(r){ if(r.length > w) w = r.length; });
  return rows.map(function(r){ return r + new Array(w - r.length + 1).join('T'); });
}

function loadMap(id, x, y, dir){
  var def = MAP_DEFS[id];
  var rows = normalizeRows(def.rows);
  map = {
    id: id, w: rows[0].length, h: rows.length, rows: rows,
    npcs: (def.npcs || []).map(function(n){ return Object.assign({}, n); })
  };
  player.x = x; player.y = y; player.dir = dir || 'down';
  player.moving = false; player.fx = 0; player.fy = 0; player.walkT = 0; player.stepCount = 0;
  game.mapId = id; game.x = x; game.y = y; game.dir = player.dir;
  var hint = $('#hintChip');
  if(hint){
    hint.textContent = id === 'town' ? '方向键 / WASD 移动 · 空格 与人对话'
      : id === 'meadow' ? '走进高草会遭遇野生灵兽 · 压低血量再投灵球' : '这里的灵兽更强，先补满体力再来';
  }
  renderHUD();
  centerCam(true);
}

function tileAt(x, y){
  if(!map || x < 0 || y < 0 || x >= map.w || y >= map.h) return 'T';
  return map.rows[y].charAt(x);
}

function npcAt(x, y){
  if(!map) return null;
  for(var i=0;i<map.npcs.length;i++){
    var n = map.npcs[i];
    if(n.x === x && n.y === y) return n;
  }
  return null;
}

function walkable(x, y){
  var ch = tileAt(x, y);
  if(BLOCKED.indexOf(ch) >= 0) return false;
  if(npcAt(x, y)) return false;
  return true;
}

/* ---------------- 画布尺寸 ---------------- */
function resizeCanvas(){
  if(!canvas) return;
  var rect = $('#stage').getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  viewW = Math.max(240, Math.round(rect.width));
  viewH = Math.max(200, Math.round(rect.height));
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  tile = clamp(Math.round(Math.min(viewW / 14.5, viewH / 10.5)), 22, 62);
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  centerCam(true);
}

function centerCam(snap){
  if(!map) return;
  var px = player.x * tile + player.fx * tile;
  var py = player.y * tile + player.fy * tile;
  var tx = clamp(px + tile / 2 - viewW / 2, 0, Math.max(0, map.w * tile - viewW));
  var ty = clamp(py + tile / 2 - viewH / 2, 0, Math.max(0, map.h * tile - viewH));
  if(snap || map.w * tile <= viewW) cam.x = map.w * tile <= viewW ? (map.w * tile - viewW) / 2 : tx;
  if(snap || map.h * tile <= viewH) cam.y = map.h * tile <= viewH ? (map.h * tile - viewH) / 2 : ty;
  if(!snap){ cam.x = tx; cam.y = ty; }
}

/* ---------------- 主循环 ---------------- */
var lastTs = 0, running = false;
function loop(ts){
  if(!running) return;
  var dt = Math.min(60, ts - lastTs || 16);
  lastTs = ts;
  update(dt, ts);
  drawWorld(ts);
  requestAnimationFrame(loop);
}

function update(dt, ts){
  if(!game) return;
  if(mode === 'world' && !dialogActive() && !modalOpen() && !transitionLock){
    if(player.moving){
      player.mt += dt;
      var k = clamp(player.mt / MOVE_MS, 0, 1);
      var fx0 = player.fromX, fy0 = player.fromY;
      player.fx = (player.tx - fx0) * k;
      player.fy = (player.ty - fy0) * k;
      if(k >= 1){
        player.x = player.tx; player.y = player.ty;
        player.fx = 0; player.fy = 0; player.moving = false;
        game.x = player.x; game.y = player.y;
        onStepDone();
      }
    } else {
      var dir = input.up ? 'up' : (input.down ? 'down' : (input.left ? 'left' : (input.right ? 'right' : null)));
      if(dir){
        player.walkT += dt;
        if(player.walkT > 118){ player.walkT = 0; tryMove(dir); }
      } else {
        player.walkT = 118;
      }
    }
  }
  if(map) centerCam(false);
  // 小满的随机游走
  if(mode === 'world' && map && map.id === 'town' && Math.random() < 0.0015){
    var kid = npcAt(13, 12);
    if(kid && !kid._moving){
      var d = pick([[0,1],[0,-1],[1,0],[-1,0]]);
      var nx2 = kid.x + d[0], ny2 = kid.y + d[1];
      if(walkable(nx2, ny2) && Math.abs(nx2 - 13) < 3 && Math.abs(ny2 - 12) < 3){ kid.x = nx2; kid.y = ny2; }
    }
  }
}

function tryMove(dir){
  if(player.moving || transitionLock || dialogActive() || modalOpen() || mode !== 'world') return;
  player.dir = dir;
  var d = DIRS[dir];
  var nx = player.x + d.x, ny = player.y + d.y;
  if(!walkable(nx, ny)){
    sfx('bump');
    return;
  }
  player.fromX = player.x; player.fromY = player.y;
  player.tx = nx; player.ty = ny;
  player.moving = true; player.mt = 0; player.fx = 0; player.fy = 0;
  if(tileAt(nx, ny) === 'G') sfx('step');
}

function onStepDone(){
  game.steps++;
  var def = MAP_DEFS[map.id];
  var ex = def.exits[player.x + ',' + player.y];
  if(ex){ doTransition(ex); return; }
  if(def.encounter && tileAt(player.x, player.y) === 'G'){
    player.stepCount++;
    if(player.stepCount > 1 && chance(def.encounter.rate)){ startEncounter(); return; }
  }
  if(game.steps % 10 === 0) saveGame(true);
  renderHUD();
}

function doTransition(ex){
  if(transitionLock) return;
  transitionLock = true;
  var fade = $('#fadeLayer');
  fade.style.opacity = '1';
  sfx('step');
  setTimeout(function(){
    loadMap(ex.to, ex.x, ex.y, ex.dir);
    if(ex.to !== 'town') markSeenNearby();
    fade.style.opacity = '0';
    setTimeout(function(){ transitionLock = false; }, 180);
    saveGame(true);
  }, 240);
}

function markSeenNearby(){}

/* ---------------- 绘制 ---------------- */
function drawWorld(ts){
  if(!ctx || !map) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0d141a';
  ctx.fillRect(0, 0, viewW, viewH);
  var ox = Math.round(cam.x), oy = Math.round(cam.y);
  var x0 = Math.floor(ox / tile), y0 = Math.floor(oy / tile);
  var x1 = Math.ceil((ox + viewW) / tile), y1 = Math.ceil((oy + viewH) / tile);
  var s = tile / TILE;
  for(var y = y0; y <= y1; y++){
    for(var x = x0; x <= x1; x++){
      var ch = tileAt(x, y);
      var dx = Math.round(x * tile - ox), dy = Math.round(y * tile - oy);
      drawTile(ctx, ch, dx, dy, s, x, y, ts || 0);
    }
  }
  // NPC
  map.npcs.forEach(function(n){
    var dx = Math.round(n.x * tile - ox), dy = Math.round(n.y * tile - oy);
    drawNPC(ctx, n, dx, dy, s, ts || 0);
  });
  // 玩家
  var pdx = Math.round(player.x * tile + player.fx * tile - ox);
  var pdy = Math.round(player.y * tile + player.fy * tile - oy);
  var frame = (player.moving && Math.floor((ts || 0) / 150) % 2 === 0) ? 1 : 0;
  drawHero(ctx, pdx, pdy, s, player.dir, frame);
  // 暗角
  if(MAP_DEFS[map.id].dark){
    var g = ctx.createRadialGradient(pdx + tile/2, pdy + tile/2, tile*1.6, pdx + tile/2, pdy + tile/2, Math.max(viewW, viewH)*0.75);
    g.addColorStop(0, 'rgba(6,10,16,0)');
    g.addColorStop(1, 'rgba(6,10,16,.62)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);
  }
}

function drawNPC(c, n, dx, dy, s, ts){
  var bob = Math.sin((ts || 0) / 520 + n.x) * 0.6;
  dy += Math.round(bob * s);
  var r = function(x,y,w,h,col){ c.fillStyle = col; c.fillRect(dx+x*s, dy+y*s, w*s, h*s); };
  c.globalAlpha = .25; c.fillStyle = '#000';
  c.beginPath(); c.ellipse(dx+8*s, dy+15.3*s, 5*s, 1.6*s, 0, 0, Math.PI*2); c.fill();
  c.globalAlpha = 1;
  var pal = {
    elder:{cloth:'#6b8f5a', hair:'#e8e4d8', skin:'#eec8a2'},
    merchant:{cloth:'#c98a4f', hair:'#3a2b23', skin:'#f0c8a0'},
    keeper:{cloth:'#4f8fa0', hair:'#2b3a44', skin:'#f0c8a0'},
    kid:{cloth:'#e07a8a', hair:'#4a3222', skin:'#f5d0ae'},
    explorer:{cloth:'#7a6ba8', hair:'#3a2b23', skin:'#e8c49c'},
    sign:{cloth:'#c9a86a', hair:'#5d4126', skin:'#c9a86a'}
  }[n.sprite || 'kid'] || {cloth:'#888', hair:'#333', skin:'#eee'};
  if(n.sprite === 'sign'){ r(3,5,10,7,'#c9a86a'); r(4,6,8,5,'#a8894f'); r(7,12,2,3,'#5d4126'); return; }
  r(4,2,8,3,pal.hair); r(4,5,8,4,pal.skin);
  r(6,7,1,1,'#2a1f19'); r(9,7,1,1,'#2a1f19');
  r(4,9,8,5,pal.cloth); r(4,13,3,2,'#333'); r(9,13,3,2,'#333');
  if(n.sprite === 'elder'){ r(4,12,8,1,'#e8e4d8'); }
  if(n.sprite === 'kid'){ r(4,2,2,3,'#4a3222'); r(10,2,2,3,'#4a3222'); }
}

function interact(){
  if(!game || mode !== 'world' || transitionLock || modalOpen()) return;
  if(dialogActive()){ advanceDialog(); return; }

function recordDex(spId, seen, caught){
  var r = game.dex[spId] || (game.dex[spId] = {seen:false, caught:0});
  if(seen) r.seen = true;
  if(caught) r.caught = (r.caught || 0) + 1;
}

function weightedPick(table){
  var total = 0;
  table.forEach(function(t){ total += t.w; });
  var r = Math.random() * total;
  for(var i=0;i<table.length;i++){ r -= table[i].w; if(r <= 0) return table[i]; }
  return table[table.length-1];
}
function randRange(a, b){ return a + rnd(b - a + 1); }

async function startEncounter(){
  if(!map || mode !== 'world') return;
  input.up = input.down = input.left = input.right = false;
  mode = 'battle';
  var ex = $('#encFlash');
  ex.classList.remove('on');
  void ex.offsetWidth;
  ex.classList.add('on');
  sfx('encounter');
  await sleep(430);
  var def = MAP_DEFS[map.id].encounter;
  var entry = weightedPick(def.table);
  var lvl = randRange(entry.lv[0], entry.lv[1]);
  var foe = makeMon(entry.sp, lvl);
  recordDex(entry.sp, true, false);
  battle = {enemy:foe, busy:true, over:false, turn:1, fleeTries:0, needSwitch:false};
  $('#battleLayer').classList.remove('hidden');
  $('#mapOverlay').classList.add('hidden');
  renderBattle();
  setActions(false);
  setBattleLog('草丛里窜出了野生的' + SPECIES[foe.sp].name + '！', '（Lv.' + foe.lvl + '）');
  await sleep(700);
  battle.busy = false;
  setActions(true);
  saveGame(true);
}

/* ---------------- 伤害计算 ---------------- */
function computeDamage(atkMon, defMon, mv){
  var a = stats(atkMon), d = stats(defMon);
  var eff = (mv.type && mv.type !== 'none') ? typeMult(mv.type, SPECIES[defMon.sp].type) : 1;
  var stab = (mv.type && mv.type === SPECIES[atkMon.sp].type) ? 1.3 : 1;
  var crit = chance(1 / 16) ? 1.5 : 1;
  var roll = 0.86 + Math.random() * 0.15;
  var raw = ((2 * atkMon.lvl / 5 + 2) * mv.power * a.atk / Math.max(1, d.def)) / 50 + 2;
  var dmg = Math.max(1, Math.floor(raw * eff * stab * crit * roll));
  return {dmg:dmg, eff:eff, crit:crit > 1, stab:stab > 1};
}

function shakeEl(el){
  if(!el) return;
  el.classList.remove('shake-hit');
  void el.offsetWidth;
  el.classList.add('shake-hit');
  setTimeout(function(){ el.classList.remove('shake-hit'); }, 400);
}

/* ---------------- 执行技能 ---------------- */
async function executeMove(side, moveId){
  if(!battle || battle.over) return;
  var isP = side === 'player';
  var mon = isP ? game.party[0] : battle.enemy;
  var foe = isP ? battle.enemy : game.party[0];
  var mv = MOVES[moveId] || MOVES.pinyin;
  if(isP){
    var rec = null;
    mon.moves.forEach(function(x){ if(x.id === moveId) rec = x; });
    if(rec && rec.pp > 0) rec.pp--;
  }
  setBattleLog((isP ? '' : '野生的 ') + SPECIES[mon.sp].name + ' 使出了 ' + mv.name + '！', '');
  await sleep(430);
  if(!chance(mv.acc)){
    setBattleLog(mv.name + ' 擦着边过去了，没有命中。', '');
    sfx('weak');
    await sleep(620);
    return;
  }
  var res = computeDamage(mon, foe, mv);
  shakeEl(isP ? $('#enemyWrap') : $('#playerWrap'));
  sfx(res.eff > 1 ? 'superhit' : (res.eff < 1 ? 'weak' : 'hit'));
  await sleep(240);
  foe.hp = Math.max(0, foe.hp - res.dmg);
  updateBars();
  var extra = '';
  if(res.crit) extra += '会心一击！';
  if(res.eff > 1) extra += '效果很好！';
  else if(res.eff < 1) extra += '效果不太好……';
  setBattleLog((isP ? '野生的 ' : '') + SPECIES[foe.sp].name + ' 受到 ' + res.dmg + ' 点伤害。', extra);
  await sleep(720);
  if(foe.hp <= 0) await handleFaint(isP ? 'enemy' : 'player');
}

/* ---------------- 敌方行动 ---------------- */
function chooseEnemyMove(){
  var foe = battle.enemy;
  var usable = foe.moves.filter(function(m){ return m.pp > 0 || MOVES[m.id].pp === 0; });
  if(!usable.length) return 'pinyin';
  var scored = usable.map(function(m){
    var mv = MOVES[m.id];
    var eff = (mv.type && mv.type !== 'none') ? typeMult(mv.type, SPECIES[game.party[0].sp].type) : 1;
    var stab = (mv.type === SPECIES[foe.sp].type) ? 1.3 : 1;
    return {id:m.id, score:mv.power * eff * stab * mv.acc};
  });
  scored.sort(function(a, b){ return b.score - a.score; });
  if(chance(0.72)) return scored[0].id;
  return pick(usable).id;
}
async function enemyMove(){
  if(!battle || battle.over) return;
  var id = chooseEnemyMove();
  var rec = null;
  battle.enemy.moves.forEach(function(m){ if(m.id === id) rec = m; });
  if(rec && rec.pp > 0) rec.pp--;
  await executeMove('enemy', id);
}

/* ---------------- 回合入口 ---------------- */
async function playerAct(kind, payload){
  if(!battle || battle.busy || battle.over) return;
  var me = game.party[0], foe = battle.enemy;
  battle.busy = true;
  setActions(false);
  hideSub();
  try{
    if(kind === 'run'){
      var p = clamp(0.42 + (stats(me).spd - stats(foe).spd) * 0.012 + battle.fleeTries * 0.12, 0.18, 0.94);
      battle.fleeTries++;
      setBattleLog('你试着抽身退开……', '');
      await sleep(560);
      if(chance(p)){
        sfx('ui');
        setBattleLog('成功脱身了！', '');
        await sleep(700);
        await endBattle(false);
        return;
      }
      setBattleLog('没能跑掉！', '');
      sfx('error');
      await sleep(520);
      await enemyMove();
      return;
    }
    if(kind === 'ball'){
      await throwBall(payload);
      return;
    }
    if(kind === 'item'){
      await usePotionInBattle(payload);
      return;
    }
    if(kind === 'move'){
      var mySpd = stats(me).spd, foeSpd = stats(foe).spd;
      var myFirst = mySpd >= foeSpd;
      if(myFirst){
        await executeMove('player', payload);
        if(!battle || battle.over) return;
        await enemyMove();
      } else {
        await enemyMove();
        if(!battle || battle.over) return;
        await executeMove('player', payload);
      }
    }
  }catch(err){
    console.error(err);
    setBattleLog('……（回合结算出了点问题，已跳过这一回合）', '');
  }finally{
    if(battle && !battle.over && !battle.needSwitch){
      battle.busy = false;
      setActions(true);
      battle.turn++;
    }
  }
}

/* ---------------- 捕捉 ---------------- */
function catchChance(foe, ballKey){
  var mx = maxHp(foe);
  var hpFactor = (3 * mx - 2 * foe.hp) / (3 * mx);
  var base = SPECIES[foe.sp].catch / 255;
  var bonus = ITEMS[ballKey].ball;
  var lvFactor = clamp(1 - (foe.lvl - 5) * 0.015, 0.72, 1);
  return clamp(hpFactor * base * bonus * 1.65 * lvFactor, 0.04, 0.95);
}

async function throwBall(ballKey){
  if(!game.items[ballKey]){
    setBattleLog('没有' + ITEMS[ballKey].name + '了。', '');
    sfx('error');
    await sleep(600);
    return;
  }
  game.items[ballKey]--;
  renderHUD();
  sfx('throw');
  setBattleLog('你投出了' + ITEMS[ballKey].name + '！', '');
  var ball = $('#ballEl');
  $('#captureLayer').classList.remove('hidden');
  ball.style.cssText = 'opacity:1;left:0;top:0;';
  try{
    var stage = $('#stage').getBoundingClientRect();
    var t = $('#enemyWrap').getBoundingClientRect();
    var x0 = stage.width * 0.22, y0 = stage.height * 0.66;
    var x1 = t.left - stage.left + t.width / 2 - 11;
    var y1 = t.top - stage.top + t.height / 2 - 11;
    var anim = ball.animate([
      {transform:'translate(' + x0 + 'px,' + y0 + 'px) scale(.75) rotate(0deg)', offset:0},
      {transform:'translate(' + ((x0 + x1) / 2) + 'px,' + (Math.min(y0, y1) - 70) + 'px) scale(1.05) rotate(200deg)', offset:.55},
      {transform:'translate(' + x1 + 'px,' + y1 + 'px) scale(1) rotate(420deg)', offset:1}
    ], {duration:600, easing:'ease-out'});
    await anim.finished;
  }catch(e){
    await sleep(520);
  }
  ball.style.transform = 'translate(' + (x1 || 0) + 'px,' + (y1 || 0) + 'px)';
  sfx('shake');
  setBattleLog(ITEMS[ballKey].name + '把野生的' + SPECIES[battle.enemy.sp].name + '收了进去。', '');
  await sleep(360);
  var success = chance(catchChance(battle.enemy, ballKey));
  var shakes = success ? 3 : rnd(3);
  for(var i=0;i<shakes;i++){
    try{
      await ball.animate([{transform:'translateX(0) rotate(0)'},{transform:'translateX(-4px) rotate(-8deg)'},{transform:'translateX(4px) rotate(8deg)'},{transform:'translateX(0) rotate(0)'}], {duration:420}).finished;
    }catch(e){ await sleep(200); }
    sfx('shake');
  }
  if(success){
    await captureSuccess();
  } else {
    sfx('breakout');
    setBattleLog('球晃了' + (shakes || 1) + '下——', '野生的' + SPECIES[battle.enemy.sp].name + '挣脱了出来！');
    await sleep(760);
    try{ await ball.animate([{opacity:1},{opacity:0}], {duration:250}).finished; }catch(e){}
    ball.style.opacity = '0';
    $('#captureLayer').classList.add('hidden');
    await enemyMove();
  }
}

async function captureSuccess(){
  var foe = battle.enemy;
  battle.over = true;
  sfx('catch');
  $('#ballEl').classList.add('caught');
  var name = SPECIES[foe.sp].name;
  recordDex(foe.sp, true, true);
  foe.exp = 0;
  if(game.party.length < 6){
    game.party.push(foe);
    setBattleLog('抓到了野生的' + name + '！', '它加入了你的队伍。');
  } else {
    game.box.push(foe);
    setBattleLog('抓到了野生的' + name + '！', '队伍已满，它被先送到收纳盒。');
  }
  renderHUD();
  await sleep(1100);
  $('#ballEl').classList.remove('caught');
  $('#captureLayer').classList.add('hidden');
  await endBattle(true);
}

/* ---------------- 药水（战斗内） ---------------- */
async function usePotionInBattle(itemKey){
  var it = ITEMS[itemKey], me = game.party[0], mx = maxHp(me);
  if(!game.items[itemKey]){
    setBattleLog('没有' + it.name + '了。', '');
    await sleep(500);
    return;
  }
  if(me.hp >= mx){
    setBattleLog(SPECIES[me.sp].name + ' 现在体力是满的。', '');
    await sleep(520);
    return;
  }
  game.items[itemKey]--;
  var before = me.hp;
  me.hp = Math.min(mx, me.hp + it.heal);
  sfx('heal');
  setBattleLog('你给' + SPECIES[me.sp].name + '用了' + it.name + '。', '回复了 ' + (me.hp - before) + ' 点体力。');
  updateBars(); renderHUD();
  await sleep(760);
  await enemyMove();
}

/* ---------------- 战败 / 升级 / 进化 ---------------- */
async function handleFaint(who){
  if(!battle) return;
  if(who === 'enemy'){
    sfx('faint');
    var ew = $('#enemyWrap');
    ew.classList.add('faint');
    setBattleLog('野生的' + SPECIES[battle.enemy.sp].name + ' 倒下了！', '');
    await sleep(760);
    ew.classList.remove('faint');
    battle.over = true;
    await gainBattleExp();
    await finishWin();
  } else {
    sfx('faint');
    var pw = $('#playerWrap');
    pw.classList.add('faint');
    setBattleLog(SPECIES[game.party[0].sp].name + ' 站不住了！', '');
    await sleep(760);
    pw.classList.remove('faint');
    var alive = false;
    for(var i=1;i<game.party.length;i++){ if(game.party[i].hp > 0) alive = true; }
    if(alive){
      battle.needSwitch = true;
      battle.busy = false;
      setBattleLog('换一只灵兽继续吧。', '');
      openSwitchMenu(true);
    } else {
      battle.over = true;
      await whiteout();
    }
  }
}

function learnMoves(mon){
  var learned = [];
  SPECIES[mon.sp].learn.forEach(function(e){
    if(e.lv !== mon.lvl) return;
    if(mon.moves.some(function(m){ return m.id === e.m; })) return;
    var rec = {id:e.m, pp:MOVES[e.m].pp};
    if(mon.moves.length < 4) mon.moves.push(rec);
    else mon.moves[0] = rec;
    learned.push(MOVES[e.m].name);
  });
  return learned;
}

async function gainBattleExp(){
  var mon = game.party[0], foe = battle.enemy;
  var amount = Math.round(SPECIES[foe.sp].exp * foe.lvl * 0.8 + 6);
  var gold = 8 + foe.lvl * 4 + rnd(6);
  game.money += gold;
  game.wins++;
  renderHUD();
  setBattleLog(SPECIES[mon.sp].name + ' 获得 ' + amount + ' 点经验。', '捡到 ' + gold + ' 金。');
  await sleep(760);
  mon.exp += amount;
  var ups = 0, allLearned = [];
  while(mon.exp >= expToNext(mon.lvl) && mon.lvl < 60){
    mon.exp -= expToNext(mon.lvl);
    var oldMax = maxHp(mon);
    mon.lvl++;
    mon.hp = Math.min(maxHp(mon), mon.hp + (maxHp(mon) - oldMax));
    ups++;
    learnMoves(mon).forEach(function(n){ allLearned.push(n); });
  }
  if(ups){
    sfx('levelup');
    setBattleLog(SPECIES[mon.sp].name + ' 升到了 Lv.' + mon.lvl + '！',
      allLearned.length ? '学会了 ' + allLearned.join('、') + '。' : '各项能力都提高了。');
    updateBars(); renderHUD();
    await sleep(1000);
    var evo = SPECIES[mon.sp].evolve;
    if(evo && mon.lvl >= evo.lv) await evolveMon(mon);
  }
}

async function evolveMon(mon){
  var evo = SPECIES[mon.sp].evolve;
  if(!evo) return;
  var fromName = SPECIES[mon.sp].name, toName = SPECIES[evo.to].name;
  var layer = $('#evoLayer'), cv = $('#evoSprite');
  drawSprite(cv, mon.sp, {unit:12});
  $('#evoText').textContent = fromName + ' 浑身发亮，正在蜕变……';
  layer.classList.remove('hidden');
  sfx('evolve');
  await sleep(420);
  layer.classList.add('flash');
  var tint = 0;
  var iv = setInterval(function(){
    tint = 1 - tint;
    drawSprite(cv, mon.sp, {unit:12, silhouette: tint ? '#f6fdff' : null});
  }, 150);
  await sleep(1500);
  clearInterval(iv);
  var oldMax = maxHp(mon);
  mon.sp = evo.to;
  mon.hp = Math.min(maxHp(mon), mon.hp + (maxHp(mon) - oldMax));
  var learned = learnMoves(mon);
  layer.classList.remove('flash');
  drawSprite(cv, mon.sp, {unit:12});
  $('#evoText').textContent = fromName + ' 蜕变成了 ' + toName + '！';
  sfx('levelup');
  await sleep(1400);
  layer.classList.add('hidden');
  setBattleLog(fromName + ' 蜕变成了 ' + toName + '！', learned.length ? '学会了 ' + learned.join('、') + '。' : '');
  renderBattle();
  await sleep(600);
}

async function finishWin(){
  setBattleLog('战斗结束。', '');
  await sleep(700);
  await endBattle(true);
}

async function whiteout(){
  setBattleLog('你眼前一白……', '');
  await sleep(600);
  var fade = $('#fadeLayer');
  fade.style.opacity = '1';
  await sleep(340);
  var lost = Math.floor(game.money * 0.1);
  game.money = Math.max(0, game.money - lost);
  game.party.forEach(function(m){ m.hp = maxHp(m); });
  hideBattle();
  loadMap('town', 12, 9, 'up');
  mode = 'world';
  fade.style.opacity = '0';
  saveGame(true);
  renderHUD();
  showDialog('泉守', [
    '有人把你和灵兽一起背回了泉边。',
    '都缓过来了。' + (lost ? '路上掉了 ' + lost + ' 金，人没事就好。' : '下次别硬撑。')
  ], null);
}

async function endBattle(won){
  if(won){
    var foe = battle.enemy;
    recordDex(foe.sp, true, false);
  }
  hideBattle();
  mode = 'world';
  map && loadMap(game.mapId, game.x, game.y, player.dir);
  saveGame(true);
  renderHUD();
}

function hideBattle(){
  $('#battleLayer').classList.add('hidden');
  $('#mapOverlay').classList.remove('hidden');
  hideSub();
  battle = null;
  setActions(true);
  lastTs = 0;
}
