function openSwitchMenu(forced){
  if(!battle) return;
  var rows = game.party.map(function(m, i){
    var mx = maxHp(m);
    var dead = m.hp <= 0;
    return '<button class="sub-row" data-switch="' + i + '"' + (dead || i === 0 ? ' disabled' : '') + '>' +
      '<span>' + SPECIES[m.sp].name + ' Lv.' + m.lvl + (i === 0 ? '（出战中）' : '') + '</span>' +
      '<span class="mv-type" style="color:' + TYPES[SPECIES[m.sp].type].color + '">' + TYPES[SPECIES[m.sp].type].name + '</span>' +
      '<span class="mv-pp">HP ' + Math.max(0, m.hp) + '/' + mx + '</span>' +
      '<span class="mv-pp">' + (dead ? '已倒下' : '') + '</span>' +
      '</button>';
  }).join('');
  showSub('<div class="sub-head"><span>' + (forced ? '选择接替出战的灵兽' : '更换出战灵兽') + '</span>' +
    (forced ? '' : '<button class="sub-close" data-subclose="1">返回</button>') + '</div>' + rows);
  $$('#battleSub [data-switch]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.getAttribute('data-switch');
      doSwitch(i, forced);
    });
  });
  if(!forced) bindSubClose();
}
async function doSwitch(i, forced){
  if(!battle || i <= 0 || game.party[i].hp <= 0) return;
  var m = game.party.splice(i, 1)[0];
  game.party.unshift(m);
  sfx('ui');
  hideSub();
  battle.needSwitch = false;
  renderBattle();
  setBattleLog('上吧，' + SPECIES[m.sp].name + '！', '');
  await sleep(600);
  if(forced){
    battle.busy = false;
    setActions(true);
    battle.turn++;
  } else {
    battle.busy = true;
    setActions(false);
    await enemyMove();
    if(battle && !battle.over && !battle.needSwitch){
      battle.busy = false;
      setActions(true);
      battle.turn++;
    }
  }
}
function bindSubClose(){
  $$('#battleSub [data-subclose]').forEach(function(b){
    b.addEventListener('click', function(){ sfx('ui'); hideSub(); });
  });
}
/* =========================================================
   启动、标题、输入绑定、美术预览
   ========================================================= */
function startTitle(){
  mode = 'title';
  game = newGame();
  loadMap('town', 10, 8, 'down');
  running = true;
  if(!lastTs){ lastTs = 0; requestAnimationFrame(loop); }
  var cards = STARTERS.map(function(id, i){
    var sp = SPECIES[id];
    var mv = movesFor(id, 5).map(function(m){ return MOVES[m.id].name; }).join(' · ');
    return '<button class="starter" data-starter="' + id + '">' +
      '<canvas width="64" height="64"></canvas>' +
      '<div class="st-name">' + sp.name + '</div>' +
      '<div class="st-desc" style="color:' + TYPES[sp.type].color + '">' + TYPES[sp.type].name + '</div>' +
      '<div class="st-desc">' + sp.desc + '</div>' +
      '<div class="st-desc" style="color:#93a4b3">' + mv + '</div>' +
      '</button>';
  }).join('');
  openModal('' +
    '<div class="modal-head"><div><div class="title-big">口袋世界</div><div class="title-sub">灵兽捕捉 · 养成 · 图鉴</div></div></div>' +
    '<p class="muted">玩法参考经典怪物捕捉 RPG，角色、怪物、地名、技能与美术全部原创。<br>选一只灵兽作为同伴，然后往南边的萤草坡走。</p>' +
    '<div class="divider"></div>' +
    '<div class="modal-title" style="font-size:13px">选择你的第一只灵兽</div>' +
    '<div class="starter-grid" id="starterGrid">' + cards + '</div>' +
    '<div class="divider"></div>' +
    '<div class="note">键盘：方向键 / WASD 移动，空格互动，Esc 打开菜单。<br>手机：用屏幕左下十字键移动，右下「互动」按钮对话与购买。</div>');
  var grid = $('#starterGrid');
  $$('#starterGrid canvas').forEach(function(c, i){ drawSprite(c, STARTERS[i], {unit:4}); });
  $$('#starterGrid [data-starter]').forEach(function(b){
    b.addEventListener('click', function(){
      startNewGame(b.getAttribute('data-starter'));
    });
  });
}

function startNewGame(starterId){
  game = newGame();
  game.party.push(makeMon(starterId, 5));
  recordDex(starterId, true, true);
  game.flags.seenIntro = true;
  game.flags.intro = true;
  loadMap('town', 10, 8, 'down');
  mode = 'world';
  closeModal();
  sfx('ui');
  saveGame(true);
  renderHUD();
  showIntroCard();
}

function showIntroCard(){
  var me = game.party[0];
  openModal('' +
    '<div class="modal-head"><div class="modal-title">开始冒险</div><button class="modal-close" data-close="1">稍后</button></div>' +
    '<p class="muted">' + SPECIES[me.sp].name + ' 跟在你脚边，看上去有点紧张。</p>' +
    '<div class="tip-card">' +
      '<div class="tip-line"><span class="tk">↑↓←→</span><span>方向键、WASD 或屏幕十字键移动，一格一格走。</span></div>' +
      '<div class="tip-line"><span class="tk">草</span><span>走进<b>高草</b>会随机遇到野生灵兽，镇子里的草丛最安全。</span></div>' +
      '<div class="tip-line"><span class="tk">技</span><span>战斗里选技能攻击，属性相克能打出更高伤害。</span></div>' +
      '<div class="tip-line"><span class="tk">球</span><span>把对方血量压低，再投<b>灵球</b>，成功率会高很多。</span></div>' +
      '<div class="tip-line"><span class="tk">泉</span><span>镇上的疗愈泉免费回复全队，商店卖球和药水。</span></div>' +
    '</div>' +
    '<p class="note">进度会自动保存在这台设备的浏览器里，关掉页面再打开可以接着玩。</p>' +
    '<div class="panel-grid" style="grid-template-columns:1fr;margin-top:10px">' +
      '<button class="small-btn primary" data-close="1" style="padding:11px">开始冒险</button>' +
    '</div>');
  bindClose();
}

/* ---------------- 输入 ---------------- */
var KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
};

function bindInput(){
  window.addEventListener('keydown', function(e){
    if(e.key === 'Tab') return;
    var dir = KEYMAP[e.key];
    if(dir){
      e.preventDefault();
      input[dir] = true;
      if(dialogActive() || modalOpen()) return;
      if(mode === 'world' && !player.moving && !transitionLock) tryMove(dir);
      return;
    }
    if(e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      if(dialogActive()){ advanceDialog(); return; }
      if(modalOpen()){ return; }
      if(mode === 'world') interact();
      return;
    }
    if(e.key === 'Escape'){
      e.preventDefault();
      if(!$('#battleSub').classList.contains('hidden')){ hideSub(); return; }
      if(dialogActive()){ advanceDialog(); return; }
      if(modalOpen()){ closeModal(); return; }
      if(mode === 'world') openSettings();
      return;
    }
    if(/^[1-4]$/.test(e.key) && mode === 'battle' && battle && !battle.busy){
      if($('#battleSub').classList.contains('hidden')) openMoveMenu();
      var idx = +e.key - 1;
      var mv = game.party[0].moves[idx];
      if(mv && mv.pp > 0) playerAct('move', mv.id);
    }
  });
  window.addEventListener('keyup', function(e){
    var dir = KEYMAP[e.key];
    if(dir) input[dir] = false;
  });
  window.addEventListener('blur', function(){ input.up = input.down = input.left = input.right = false; });

  $$('#controls [data-dir]').forEach(function(b){
    var dir = b.getAttribute('data-dir');
    var press = function(e){
      e.preventDefault();
      input[dir] = true;
      b.classList.add('press');
      if(mode === 'world' && !player.moving && !transitionLock && !dialogActive() && !modalOpen()) tryMove(dir);
    };
    var release = function(e){
      if(e) e.preventDefault();
      input[dir] = false;
      b.classList.remove('press');
    };
    b.addEventListener('pointerdown', press);
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('pointerleave', release);
    b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  });

  $('#actBtn').addEventListener('click', function(){
    if(dialogActive()){ advanceDialog(); return; }
    if(mode === 'world') interact();
  });
  $('#menuBtn').addEventListener('click', function(){
    if(mode === 'battle'){ hideSub(); return; }
    if(modalOpen()) closeModal(); else openSettings();
  });
  $$('#hud [data-panel]').forEach(function(b){
    b.addEventListener('click', function(){
      var p = b.getAttribute('data-panel');
      if(mode === 'battle'){ toast('战斗中不能整理背包', true); return; }
      if(p === 'party') openParty();
      else if(p === 'dex') openDex();
      else if(p === 'bag') openBag();
      else openSettings();
    });
  });

  $$('#battleActions [data-act]').forEach(function(b){
    b.addEventListener('click', function(){
      var act = b.getAttribute('data-act');
      if(!battle || battle.busy || battle.over) return;
      if(act === 'fight') openMoveMenu();
      else if(act === 'ball') openBallMenu();
      else if(act === 'item') openPotionMenuInBattle();
      else if(act === 'run') playerAct('run');
    });
  });

  $('#dialogBox').addEventListener('click', function(){ advanceDialog(); });
  $('#stage').addEventListener('click', function(e){
    if(dialogActive()) advanceDialog();
  });
  $('#modalRoot').addEventListener('click', function(e){
    if(e.target === $('#modalRoot')) closeModal();
  });
  window.addEventListener('beforeunload', function(){ if(game && mode !== 'title') saveGame(true); });
}

/* ---------------- 美术预览（?art=1） ---------------- */
function showArtGallery(){
  var cells = DEX_ORDER.map(function(k){
    var sp = SPECIES[k];
    return '<div class="dex-cell"><canvas width="96" height="96" data-sp="' + k + '"></canvas>' +
      '<div class="dn">' + sp.name + '</div><div class="dx">' + TYPES[sp.type].name + '</div></div>';
  }).join('');
  openModal('<div class="modal-head"><div class="modal-title">美术预览</div><button class="modal-close" data-close="1">关闭</button></div>' +
    '<div class="dex-grid">' + cells + '</div>' +
    '<div class="divider"></div>' +
    '<canvas id="tileStrip" width="720" height="120" style="width:100%;image-rendering:pixelated;border-radius:8px;background:#0e151b"></canvas>' +
    '<div class="divider"></div>' +
    '<canvas id="heroStrip" width="360" height="120" style="width:100%;image-rendering:pixelated;background:#3d6b3c;border-radius:8px"></canvas>');
  $$('#modalCard [data-sp]').forEach(function(c){ drawSprite(c, c.getAttribute('data-sp'), {unit:6}); });
  var tc = $('#tileStrip'), tx = tc.getContext('2d');
  tx.imageSmoothingEnabled = false;
  var list = [',','.','G','T','W','H','D','F','S','C','A','R','x','='];
  list.forEach(function(ch, i){ drawTile(tx, ch, i * 48, 0, 3, i, 3, 500); });
  var hc = $('#heroStrip'), hx = hc.getContext('2d');
  hx.imageSmoothingEnabled = false;
  [['down',0],['down',1],['left',0],['right',1],['up',0],['up',1]].forEach(function(d, i){ drawHero(hx, i*60, 10, 3, d[0], d[1]); });
  bindClose();
}

/* ---------------- 启动 ---------------- */
function boot(){
  canvas = $('#mapCanvas');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  if(window.ResizeObserver){ try{ new ResizeObserver(function(){ resizeCanvas(); }).observe($('#stage')); }catch(e){} }
  bindInput();
  if(location.search.indexOf('art=1') >= 0){
    game = newGame();
    loadMap('town', 10, 8, 'down');
    running = true; requestAnimationFrame(loop);
    showArtGallery();
    return;
  }
  var saved = loadGame();
  if(saved){
    game = saved;
    mode = 'world';
    loadMap(game.mapId, game.x, game.y, game.dir);
    running = true;
    lastTs = 0;
    requestAnimationFrame(loop);
    renderHUD();
    toast('已读取上次的进度');
    if(!game.flags.seenIntro) showIntroCard();
  } else {
    startTitle();
  }
  window.__PK = {
    get game(){ return game; }, get mode(){ return mode; }, get battle(){ return battle; },
    get map(){ return map; }, get player(){ return player; }, get tile(){ return tile; },
    api:{
      tryMove:tryMove, interact:interact, startEncounter:startEncounter, playerAct:playerAct,
      openMoveMenu:openMoveMenu, openBallMenu:openBallMenu, openPotionMenuInBattle:openPotionMenuInBattle,
      openSwitchMenu:openSwitchMenu, doSwitch:doSwitch, advanceDialog:advanceDialog, showDialog:showDialog,
      saveGame:saveGame, loadGame:loadGame, loadMap:loadMap, makeMon:makeMon, catchChance:catchChance,
      computeDamage:computeDamage, startNewGame:startNewGame, startTitle:startTitle, renderHUD:renderHUD,
      openParty:openParty, openDex:openDex, openBag:openBag, openShop:openShop, openSettings:openSettings,
      updateBars:updateBars, endBattle:endBattle, hideBattle:hideBattle, drawSprite:drawSprite,
      audio:audio, setMode:function(m){ mode = m; }, recordDex:recordDex,
      drawWorld:drawWorld, drawTile:drawTile, PAL_TILE:PAL_TILE, cam:cam, tileAt:tileAt,
      ctx:function(){ return ctx; }, view:function(){ return {w:viewW,h:viewH,tile:tile,dpr:dpr}; },
      pauseLoop:function(){ running = false; }, resumeLoop:function(){ if(!running){ running = true; lastTs = 0; requestAnimationFrame(loop); } }
    }
  };
}

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); }
else { boot(); }
})();
</script>
<script>

/* =========================================================
   联机层：共享地图同步 / 聊天 / 玩家对战 / 服务端校验
   由 server.js 静态托管；未连上服务端时自动退回单机模式
   ========================================================= */
(function(){
'use strict';
var PKW = window.__PK;
var q = function(s, r){ return (r || document).querySelector(s); };
var qa = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

var NET = {
  ws: null, ready: false, joined: false, pid: null, token: null, name: null,
  online: 0, mapId: null, peers: [], peersRemote: {}, lastMoveSent: 0,
  channel: 'world', pendingBall: null, minEnemyHp: 1, potionsUsed: [], lastBattleSeen: null,
  dueling: false, reconnectDelay: 1000
};

/* ---------------- 小工具 ---------------- */
function ntoast(msg, warn){
  var box = q('#netToast');
  var el = document.createElement('div');
  el.className = 'ntoast' + (warn ? ' warn' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2400);
}
function setStatus(text, on){
  q('#netStatus').textContent = text;
  q('#netDot').className = on ? 'on' : '';
}
function offline(reason){
  NET.ready = false;
  setStatus('单机模式 · ' + reason, false);
}
function send(obj){
  if(NET.ws && NET.ws.readyState === 1){ try{ NET.ws.send(JSON.stringify(obj)); return true; }catch(e){ return false; } }
  return false;
}

/* ---------------- 连接 ---------------- */
function connect(){
  if(location.protocol === 'file:'){
    offline('本地文件打开，未连接服务器');
    q('#netLoginBtn').disabled = true;
    return;
  }
  var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  try{ NET.ws = new WebSocket(proto + location.host); }
  catch(e){ offline('浏览器不支持 WebSocket'); return; }
  NET.ws.onopen = function(){ NET.ready = true; setStatus('已连接服务端', true); tryJoin(); };
  NET.ws.onmessage = function(ev){
    var m = null;
    try{ m = JSON.parse(ev.data); }catch(e){ return; }
    handle(m);
  };
  NET.ws.onclose = function(){
    if(NET.ready) ntoast('与服务器断开，已切回单机模式', true);
    offline('连接已断开，正在重试');
    NET.joined = false;
    setTimeout(connect, NET.reconnectDelay);
    NET.reconnectDelay = Math.min(15000, NET.reconnectDelay * 1.6);
  };
  NET.ws.onerror = function(){ /* onclose 会接手 */ };
}

function stored(){
  try{ return { pid: localStorage.getItem('pk_pid'), token: localStorage.getItem('pk_token') }; }
  catch(e){ return { pid: null, token: null }; }
}
function remember(pid, token){
  try{ localStorage.setItem('pk_pid', pid); localStorage.setItem('pk_token', token); }catch(e){}
  NET.pid = pid; NET.token = token;
}
function starterFromGame(){
  var g = PKW && PKW.game;
  if(g && g.party && g.party.length) return g.party[0].sp;
  return null;
}
function tryJoin(name){
  if(!starterFromGame()){ setStatus('先在下方选一只初始灵兽', true); return; }
  var s = stored();
  var haveLocal = !!(PKW && PKW.game && PKW.game.party && PKW.game.party.length);
  if(!s.token && !name && !haveLocal){
    // 还没选初始灵兽，等本机选完再自动加入
    setStatus('先在下方选一只初始灵兽', true);
    return;
  }
  send({ t: 'join', name: name || (NET.name || ''), token: s.token || NET.token || null, starter: starterFromGame() });
}

/* ---------------- 服务端消息 ---------------- */
function handle(m){
  switch(m.t){
    case 'welcome':
      NET.joined = true; NET.name = m.name; NET.online = m.online || 1;
      remember(m.pid, m.token);
      q('#netMe').textContent = '你是 ' + m.name;
      q('#netOnline').textContent = '在线 ' + NET.online;
      q('#netLoginBtn').textContent = '联机中';
      setStatus('联机中 · ' + m.name, true);
      if(m.note) ntoast(m.note, true);
      ntoast('已加入联机世界：' + m.name);
      applyProfile(m.profile, true);
      (m.chat || []).forEach(function(c){ pushChat(c); });
      syncPos();
      break;
    case 'peers':
      NET.mapId = m.map;
      NET.peers = m.list || [];
      q('#netOnline').textContent = '在线 ' + Math.max(NET.online, NET.peers.length);
      renderNearby();
      updateRemoteTargets();
      break;
    case 'chat': pushChat(m); break;
    case 'sys': pushChat({ t: 'sys', msg: m.msg }); break;
    case 'profile': applyProfile(m.profile, false); break;
    case 'claimResult': onClaimResult(m); break;
    case 'duelInvite': showDuelInvite(m); break;
    case 'duelWait': ntoast('已向 ' + m.to + ' 发起挑战，等待接受…'); break;
    case 'duelDeclined': ntoast(m.by + ' 拒绝了挑战', true); break;
    case 'duelStart':
    case 'duelState': showDuel(m); break;
    case 'duelReady': ntoast(m.msg); break;
    case 'duelEnd': endDuel(m); break;
    case 'kicked': ntoast('同一账号在别处登录，这个标签页已退出联机', true); NET.joined = false; break;
    case 'error': ntoast(m.msg, true); break;
    case 'info': ntoast(m.msg); break;
    default: break;
  }
}

/* ---------------- 档案同步 ---------------- */
function applyProfile(p, initial){
  if(!PKW || !p || !PKW.game) return;
  var g = PKW.game;
  g.money = p.money;
  g.items = Object.assign({ lingqiu: 0, yinlingqiu: 0, yaoshui: 0, nongyao: 0 }, p.items || {});
  g.dex = p.dex || {};
  g.wins = p.wins || 0;
  var local = g.party || [];
  g.party = (p.party || []).map(function(m, i){
    var keep = local[i] && local[i].sp === m.sp ? local[i] : null;
    var mon = {
      uid: keep && keep.uid ? keep.uid : ('srv' + i + '_' + Date.now()),
      sp: m.sp, lvl: m.lvl, exp: m.exp || 0,
      hp: initial ? m.hp : (keep ? Math.min(m.hp, Math.max(1, keep.hp)) : m.hp),
      moves: (m.moves || []).map(function(x){ return { id: x.id, pp: x.pp }; })
    };
    if(initial) mon.hp = m.hp;
    if(!mon.moves.length && m.sp) mon.moves = [{ id: 'pinyin', pp: 0 }];
    return mon;
  });
  if(PKW.api && PKW.api.renderHUD) PKW.api.renderHUD();
}
function syncPos(){
  if(!PKW || !PKW.map) return;
  NET.mapId = PKW.map.id;
  send({ t: 'move', map: PKW.map.id, x: PKW.player.x, y: PKW.player.y, dir: PKW.player.dir });
  NET.lastMoveSent = Date.now();
}

/* ---------------- 远端玩家绘制 ---------------- */
function updateRemoteTargets(){
  var seen = {};
  NET.peers.forEach(function(p){
    seen[p.pid] = 1;
    var r = NET.peersRemote[p.pid];
    if(!r){ NET.peersRemote[p.pid] = { x: p.x, y: p.y, tx: p.x, ty: p.y, dir: p.dir, name: p.name, lvl: p.lvl, t: performance.now(), map: NET.mapId }; }
    else { r.tx = p.x; r.ty = p.y; r.dir = p.dir; r.name = p.name; r.lvl = p.lvl; r.t0 = performance.now(); r.fx = r.x; r.fy = r.y; }
  });
  Object.keys(NET.peersRemote).forEach(function(k){ if(!seen[k]) delete NET.peersRemote[k]; });
}
function peerInterp(r, now){
  var dt = Math.max(1, now - (r.t0 || r.t));
  var k = Math.max(0, Math.min(1, dt / 130));
  return { x: r.fx + (r.tx - r.fx) * k, y: r.fy + (r.ty - r.fy) * k };
}
function drawRemote(now){
  var c = q('#netCanvas');
  if(!c || !PKW || !PKW.map) return;
  var rect = q('#stage').getBoundingClientRect();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  if(NET.lastRect && Math.abs(NET.lastRect.w - Math.round(rect.width * dpr)) < 2 && Math.abs(NET.lastRect.h - Math.round(rect.height * dpr)) < 2
     && Math.abs(NET.lastRect.left - rect.left) < 1 && Math.abs(NET.lastRect.top - rect.top) < 1){
    rect = NET.lastRect.r;
  } else {
    NET.lastRect = { w: Math.round(rect.width * dpr), h: Math.round(rect.height * dpr), left: rect.left, top: rect.top, r: rect };
  }
  if(c.width !== Math.round(rect.width * dpr) || c.height !== Math.round(rect.height * dpr)){
    c.width = Math.round(rect.width * dpr); c.height = Math.round(rect.height * dpr);
    c.style.width = rect.width + 'px'; c.style.height = rect.height + 'px';
  }
  c.style.left = rect.left + 'px';
  c.style.top = rect.top + 'px';
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  if(NET.mapId !== PKW.map.id || !NET.peers.length) return;
  var tile = PKW.tile, cam = PKW.api ? PKW.api.cam : null;
  if(!cam) return;
  var s = tile / 16;
  Object.keys(NET.peersRemote).forEach(function(pid){
    var r = NET.peersRemote[pid];
    var pos = peerInterp(r, now);
    var dx = Math.round(pos.x * tile - cam.x), dy = Math.round(pos.y * tile - cam.y);
    ctx.globalAlpha = .28; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(dx + 8 * s, dy + 15.3 * s, 5 * s, 1.6 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    var R = function(x, y, w, h, col){ ctx.fillStyle = col; ctx.fillRect(dx + x * s, dy + y * s, w * s, h * s); };
    R(4, 2, 8, 3, '#3a2b23'); R(4, 5, 8, 4, '#f0c8a0');
    R(6, 7, 1, 1, '#2a1f19'); R(9, 7, 1, 1, '#2a1f19');
    R(4, 9, 8, 5, '#c46f8f'); R(4, 13, 3, 2, '#333'); R(9, 13, 3, 2, '#333');
    ctx.font = Math.round(11 * 1) + 'px "PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center';
    var label = r.name + ' L' + r.lvl;
    var wpx = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(9,14,19,.72)';
    ctx.fillRect(dx + 8 * s - wpx / 2 - 4, dy - 15, wpx + 8, 14);
    ctx.fillStyle = '#d8ecff';
    ctx.fillText(label, dx + 8 * s, dy - 4);
  });
}

/* ---------------- 附近玩家 ---------------- */
function renderNearby(){
  var list = q('#nearbyList');
  var rows = NET.peers.map(function(p){
    var mine = p.pid === NET.pid;
    return '<div class="peer-row"><div><div class="pn">' + escapeHtml(p.name) + (mine ? '（你）' : '') + '</div>' +
      '<div class="pl">Lv.' + p.lvl + ' · ' + p.x + ',' + p.y + '</div></div>' +
      (mine ? '' : '<button class="small-btn primary" data-duel="' + p.pid + '">挑战</button>') + '</div>';

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------------- 聊天 ---------------- */
function pushChat(m){
  var log = q('#chatLog');
  var el = document.createElement('div');
  if(m.t === 'sys' || m.from === undefined){
    el.className = 'sysline';
    el.textContent = m.msg || '';
  } else {
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = m.from + (m.channel === 'near' ? '（近旁）' : '') + '：';
    el.appendChild(who);
    el.appendChild(document.createTextNode(m.msg || ''));
  }
  log.appendChild(el);
  while(log.children.length > 60) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
  if(q('#chatBox').classList.contains('hidden') && m.t !== 'sys') ntoast('新消息：' + (m.from || '系统'));
}
function sendChat(){
  var inp = q('#chatInput');
  var text = (inp.value || '').trim();
  if(!text) return;
  if(!NET.joined){ ntoast('还没连上服务端，聊天不可用', true); return; }
  if(text.length > 120) text = text.slice(0, 120);
  if(send({ t: 'chat', channel: NET.channel, msg: text })) inp.value = '';
  else ntoast('发送失败，连接断了', true);
}

/* ---------------- 玩家对战 ---------------- */

function spName(sp){

var MOVE_NAMES = { tengman:'藤蔓缠', yeren:'叶刃', huami:'花蜜吐息', luoye:'落叶乱舞', meihui:'煤灰扑', huohua:'火花', tangzhao:'烫焰爪', chifeng:'炽风', paomoyao:'泡沫咬', shuibao:'水泡弹', chaoyong:'潮涌', wolun:'涡流冲', yanci:'岩刺', suishi:'碎石击', yingke:'硬壳顶', gunshi:'滚石压', jiyu:'疾羽', fengren:'风刃', kongqi:'空音波', xuanfeng:'旋风卷', pinyin:'拼命撞' };

/* ---------------- 单人战斗结果上报 ---------------- */
function wrapApi(){
  if(!PKW || !PKW.api) return;
  var api = PKW.api;
  var origPlayerAct = api.playerAct;
  api.playerAct = function(kind, payload){
    if(kind === 'ball'){ NET.pendingBall = payload; NET.ballHpRatio = null; }
    if(kind === 'item'){ NET.potionsUsed.push({ item: payload, slot: 0 }); }
    return origPlayerAct.apply(this, arguments);
  };
  var origOpenShop = api.openShop;
  api.openShop = function(){
    var r = origOpenShop.apply(this, arguments);
    var card = q('#modalCard');
    if(card) card.addEventListener('click', function(ev){
      var b = ev.target.closest && ev.target.closest('[data-buy]');
      if(b && NET.joined) send({ t: 'claim', kind: 'buy', item: b.getAttribute('data-buy') });
    }, true);
    return r;
  };
  var origOpenBag = api.openBag;
  api.openBag = function(){
    var r = origOpenBag.apply(this, arguments);
    var card = q('#modalCard');
    if(card) card.addEventListener('click', function(ev){
      var b = ev.target.closest && ev.target.closest('[data-heal]');
      if(b && NET.joined){
        var potion = NET.lastPotionItem || 'yaoshui';
        send({ t: 'claim', kind: 'potion', item: potion, slot: +b.getAttribute('data-heal') });
      }
    }, true);
    return r;
  };
  var origOpenPotionTarget = api.openPotionTarget;
  if(origOpenPotionTarget){
    api.openPotionTarget = function(key){
      NET.lastPotionItem = key;
      return origOpenPotionTarget.apply(this, arguments);
    };
  }
  var origInteract = api.interact;
  api.interact = function(){
    var ch = null;
    try{
      var dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      var d = dirs[PKW.player.dir] || [0, 0];
      ch = api.tileAt(PKW.player.x + d[0], PKW.player.y + d[1]);
    }catch(e){}
    var r = origInteract.apply(this, arguments);
    if(ch === 'A' && NET.joined) send({ t: 'claim', kind: 'heal' });
    return r;
  };
  NET.apiWrapped = true;
}
function onClaimResult(m){
  if(m.profile) applyProfile(m.profile, false);
  if(m.kind === 'catch'){
    if(m.caught) ntoast('服务端确认捕捉成功');
    else ntoast('服务端判定没抓住（服务器独立随机），这只灵兽没入队', true);
  } else if(m.kind === 'win'){
    if(m.ups) ntoast('服务端结算：升级 ' + m.ups + ' 级');
  } else if(m.kind === 'buy'){
    if(!m.ok) ntoast('购买未通过服务端校验', true);
  }
}
function watchBattle(now){
  if(!PKW) return;
  var b = PKW.battle;
  if(b && !NET.lastBattleSeen){
    NET.minEnemyHp = 1; NET.pendingBall = null; NET.potionsUsed = [];
    NET.battleInfo = { sp: b.enemy.sp, lvl: b.enemy.lvl, map: PKW.map ? PKW.map.id : null, startedAt: now, foeStartHp: b.enemy.hp };
  }
  if(b){
    try{
      var mx = 1;
      if(b.enemy && b.enemy.hp !== undefined){
        var showMax = b.enemyHpShownMax || null;
        var ratio = b.enemyMax ? (b.enemy.hp / b.enemyMax) : null;
        if(ratio === null){
          // 用服务端数据算不出，改用观察法：记录血量与局部最大值
          if(NET.battleInfo){
            if(NET.battleInfo.foeMaxHp === undefined || b.enemy.hp > NET.battleInfo.foeMaxHp) NET.battleInfo.foeMaxHp = Math.max(b.enemy.hp, NET.battleInfo.foeMaxHp || b.enemy.hp);
            var fm = NET.battleInfo.foeMaxHp || 1;
            ratio = b.enemy.hp / fm;
          }
        }
        if(ratio !== null) NET.minEnemyHp = Math.min(NET.minEnemyHp, Math.max(0.02, ratio));
        if(b.enemy.hp > 0) NET.lastEnemyHp = b.enemy.hp;
      }
    }catch(e){}
    NET.lastBattleSeen = b;
    return;
  }
  if(!b && NET.lastBattleSeen){
    var info = NET.battleInfo || {};
    var g = PKW.game;
    var caught = !!(NET.pendingBall && g && g.party && info.partyLen !== undefined ? g.party.length > info.partyLen : false);
    var won = NET.lastEnemyHp !== undefined && info.foeStartHp !== undefined;
    if(NET.joined && info.map){
      if(NET.pendingBall){
        send({ t: 'claim', kind: 'catch', map: info.map, sp: info.sp, lv: info.lvl, ball: NET.pendingBall, hpRatio: NET.minEnemyHp });
      } else if(info.enemyFainted){
        send({ t: 'claim', kind: 'win', map: info.map, sp: info.sp, lv: info.lvl });
      }
    }
    NET.lastBattleSeen = null; NET.battleInfo = null; NET.pendingBall = null;
    setTimeout(syncPos, 400);
  }
}
function watchBattleMeta(){
  if(!PKW) return;
  var b = PKW.battle;
  if(b && NET.battleInfo){
    if(b.enemy && b.enemy.hp <= 0) NET.battleInfo.enemyFainted = true;
    if(!NET.battleInfo.partyLen && PKW.game && PKW.game.party) NET.battleInfo.partyLen = PKW.game.party.length;
  }
}

/* ---------------- 主循环 ---------------- */
function frame(now){
  requestAnimationFrame(frame);
  if(PKW && PKW.mode !== 'title'){
    drawRemote(now);
  }
  if(now - lastPosCheck > 120){
    lastPosCheck = now;
    if(PKW && PKW.map && PKW.player && PKW.joined){
      var key = PKW.map.id + ':' + PKW.player.x + ':' + PKW.player.y;
      if(key !== lastPosKey && !PKW.player.moving){ lastPosKey = key; syncPos(); }
    }
    if(PKW && PKW.joined){
      var b = PKW.battle;
      if(b && NET.battleInfo){
        if(b.enemy && b.enemy.hp <= 0) NET.battleInfo.enemyFainted = true;
        if(NET.battleInfo.partyLen === undefined && PKW.game && PKW.game.party) NET.battleInfo.partyLen = PKW.game.party.length;
      }
      watchBattle(now);
    }
  }
  if(NET.dueling) return;
}
var lastPosCheck = 0, lastPosKey = '';

/* ---------------- 界面绑定 ---------------- */
function bindUi(){
  q('#netChatBtn').addEventListener('click', function(){
    q('#chatBox').classList.toggle('hidden');
    q('#nearbyBox').classList.add('hidden');
    if(!q('#chatBox').classList.contains('hidden')) q('#chatInput').focus();
  });
  q('#netNearBtn').addEventListener('click', function(){
    q('#nearbyBox').classList.toggle('hidden');
    q('#chatBox').classList.add('hidden');
    renderNearby();
  });
  q('#chatClose').addEventListener('click', function(){ q('#chatBox').classList.add('hidden'); });
  q('#chatSend').addEventListener('click', sendChat);
  q('#chatInput').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); sendChat(); } });
  qa('#chatHead [data-ch]').forEach(function(b){
    b.addEventListener('click', function(){
      NET.channel = b.getAttribute('data-ch');
      qa('#chatHead [data-ch]').forEach(function(x){ x.classList.toggle('active', x === b); });
    });
  });
  q('#netLoginBtn').addEventListener('click', function(){
    if(NET.joined){ q('#nearbyBox').classList.remove('hidden'); renderNearby(); return; }
    openLoginDialog();
  });
  window.addEventListener('beforeunload', function(){ if(NET.ws) try{ NET.ws.close(); }catch(e){} });
}
function openLoginDialog(){
  if(!PKW) return;
  var root = q('#modalRoot');
  var starter = starterFromGame();
  q('#modalCard').innerHTML =
    '<div class="modal-head"><div class="modal-title">加入联机世界</div><button class="modal-close" id="loginCancel">取消</button></div>' +
    '<p class="muted">输入一个昵称就能加入（不收集邮箱、手机号或任何密码）。昵称重复时服务器会自动加后缀。<br>' +
    '进度保存在服务端，换电脑用同一个浏览器打开也能接着玩。</p>' +
    '<div class="net-field"><label>昵称（1-12 个字）</label><input id="loginName" maxlength="12" placeholder="例如：毛豆" value="' + escapeHtml(NET.name || '') + '"></div>' +
    '<div class="panel-grid" style="grid-template-columns:1fr;margin-top:8px">' +
    '<button class="small-btn primary" id="loginGo" style="padding:11px">进入世界</button></div>' +
    (starter ? '<p class="note" style="margin-top:8px">将带着你的 ' + escapeHtml(spName(starter)) + ' 一起进入。</p>' : '<p class="note" style="margin-top:8px">先在游戏里选好初始灵兽，再回来加入联机。</p>');
  root.classList.remove('hidden');
  q('#loginCancel').addEventListener('click', function(){ root.classList.add('hidden'); });
  q('#loginGo').addEventListener('click', function(){
    var name = (q('#loginName').value || '').trim();
    if(name.length < 1){ ntoast('先起个昵称', true); return; }
    if(!NET.ready){ ntoast('还没连上服务端，稍后再试（当前为单机模式）', true); return; }
    NET.name = name;
    root.classList.add('hidden');
    tryJoin(name);
  });
}

/* ---------------- 启动 ---------------- */
function start(){
  var s = stored();
  if(s.token){ NET.token = s.token; NET.pid = s.pid; }
  bindUi();
  connect();
  requestAnimationFrame(frame);
  // 等游戏本体就绪后自动加入
  var waited = 0;
  var iv = setInterval(function(){
    waited += 300;
    if(window.__PK && window.__PK.api && !NET.apiWrapped){ wrapApi(); }
    if(NET.ready && window.__PK && window.__PK.mode !== 'title' && window.__PK.game && window.__PK.game.party.length && !NET.joined){
      if(!NET.joinTried || waited - NET.joinAt > 1500){
        NET.joinTried = true; NET.joinAt = waited;
        send({ t: 'join', name: NET.name || ('旅人' + Math.floor(Math.random() * 89 + 10)), token: NET.token || null, starter: starterFromGame() });
      }
    }
    if(NET.joined || waited > 30000) clearInterval(iv);
  }, 300);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();
})();

<div id="netBar">
  <span id="netDot"></span>
  <span id="netStatus">正在连接服务端…</span>
  <span class="grow"></span>
  <span class="net-chip" id="netOnline">在线 0</span>
  <span class="net-chip" id="netMe">未登录</span>
  <button class="hbtn" id="netChatBtn">聊天</button>
  <button class="hbtn" id="netNearBtn">附近</button>
  <button class="hbtn" id="netLoginBtn">加入联机</button>
</div>
<canvas id="netCanvas"></canvas>
<div id="nearbyBox" class="hidden">
  <h4>同一张地图上的玩家</h4>
  <div id="nearbyList"></div>
</div>
<div id="chatBox" class="hidden">
  <div id="chatHead">
    <button class="tab active" data-ch="world">世界</button>
    <button class="tab" data-ch="near">附近</button>
    <span class="grow" style="flex:1"></span>
    <button class="tab" id="chatClose">收起</button>
  </div>
  <div id="chatLog"></div>
  <div id="chatRow"><input id="chatInput" maxlength="120" placeholder="说点什么（回车发送）"><button class="tab" id="chatSend">发送</button></div>
</div>
<div id="duelPanel" class="hidden"></div>
<div id="netToast"></div>

</body>
</html>
